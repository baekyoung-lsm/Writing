  /* chapters: [{ title, text }]. bodyTitle: optional doc-level title, folded into the
   * section-properties paragraph's own (normally empty) run instead of adding an extra
   * leading blank paragraph. */
  function buildSectionXml(bodyTitle, chapters) {
    paraIdCounter = 0;
    var titleRun = bodyTitle
      ? '<hp:run charPrIDRef="' + HEADING_CHARPR_ID + '"><hp:t>' + hwpxEsc(bodyTitle) + '</hp:t></hp:run>'
      : '<hp:run charPrIDRef="0"><hp:t/></hp:run>';
    var body = "";
    chapters.forEach(function (ch, i) {
      body += contentParagraph(ch.title || ("(제목 없음 " + (i + 1) + ")"), HEADING_CHARPR_ID);
      var paras = (ch.text || "").split(/\n+/).filter(function (p) { return p.length; });
      if (!paras.length) body += contentParagraph("", "0");
      paras.forEach(function (p) { body += contentParagraph(p, "0"); });
    });
    return HWPX_SECTION_HEAD + HWPX_FIRST_PARA_PREFIX + titleRun + HWPX_FIRST_PARA_SUFFIX + body + HWPX_SECTION_CLOSE;
  }

  function buildContentHpf(title, author) {
    var now = new Date();
    var iso = now.toISOString();
    var koDate = now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일";
    return HWPX_CONTENT_HPF_TEMPLATE
      .replace("__HWPX_TITLE__", hwpxEsc(title))
      .replace(/__HWPX_AUTHOR__/g, hwpxEsc(author || "집썰"))
      .replace("__HWPX_CREATED__", iso)
      .replace("__HWPX_MODIFIED__", iso)
      .replace("__HWPX_DATE_KO__", koDate);
  }

  function buildPreviewText(chapters) {
    var first = (chapters[0] && chapters[0].text) || "";
    return first.replace(/\s+/g, " ").trim().slice(0, 200);
  }

  /* Re-checks the dynamic edits above stayed internally consistent with the static
   * template -- real XML well-formedness via DOMParser, plus cross-reference checks
   * that can't silently drift the way a hand-verified "looks right" check could. */
  function validateHwpxPackage(files) {
    var errors = [];

    if (files["mimetype"] !== "application/hwp+zip") errors.push("mimetype: 내용이 정확히 'application/hwp+zip'이어야 합니다.");

    Object.keys(files).forEach(function (path) {
      if (!/\.(xml|hpf|rdf)$/.test(path)) return;
      var content = files[path];
      if (typeof content !== "string") return;
      if (typeof DOMParser === "undefined") return;
      try {
        var doc = new DOMParser().parseFromString(content, "application/xml");
        var perr = doc.getElementsByTagName("parsererror")[0];
        if (perr) errors.push(path + ": XML 파싱 오류 - " + perr.textContent.slice(0, 200).replace(/\s+/g, " "));
      } catch (e) {
        errors.push(path + ": DOMParser 예외 - " + e.message);
      }
    });

    var header = files["Contents/header.xml"];
    if (header) {
      if (header.indexOf('hh:charPr id="7"') === -1) errors.push("header.xml: 제목용 charPr(id=7) 삽입이 누락됐습니다.");
      if (header.indexOf('itemCnt="8"') === -1) errors.push("header.xml: charProperties itemCnt가 8로 갱신되지 않았습니다.");
    } else errors.push("Contents/header.xml이 생성되지 않았습니다.");

    var section = files["Contents/section0.xml"];
    if (section && header) {
      var declaredCharPr = {}, declaredParaPr = {}, m;
      var reCP = /<hh:charPr id="(\d+)"/g;
      while ((m = reCP.exec(header))) declaredCharPr[m[1]] = true;
      var reP = /<hh:paraPr id="(\d+)"/g;
      while ((m = reP.exec(header))) declaredParaPr[m[1]] = true;
      var usedCP = {}, usedPP = {};
      var reUC = /charPrIDRef="(\d+)"/g;
      while ((m = reUC.exec(section))) usedCP[m[1]] = true;
      var reUP = /paraPrIDRef="(\d+)"/g;
      while ((m = reUP.exec(section))) usedPP[m[1]] = true;
      Object.keys(usedCP).forEach(function (id) {
        if (!declaredCharPr[id]) errors.push("section0.xml: 존재하지 않는 charPrIDRef=" + id + " 참조");
      });
      Object.keys(usedPP).forEach(function (id) {
        if (!declaredParaPr[id]) errors.push("section0.xml: 존재하지 않는 paraPrIDRef=" + id + " 참조");
      });
    } else errors.push("Contents/section0.xml이 생성되지 않았습니다.");

    var hpf = files["Contents/content.hpf"];
    if (hpf) {
      var reItem = /<opf:item id="[^"]+" href="([^"]+)"/g, m2;
      while ((m2 = reItem.exec(hpf))) {
        if (!(m2[1] in files)) errors.push("content.hpf: manifest가 가리키는 파일이 없습니다 - " + m2[1]);
      }
      var reRef = /<opf:itemref idref="([^"]+)"/g, itemIds = {};
      var reItem2 = /<opf:item id="([^"]+)"/g, m3;
      while ((m3 = reItem2.exec(hpf))) itemIds[m3[1]] = true;
      while ((m2 = reRef.exec(hpf))) {
        if (!itemIds[m2[1]]) errors.push("content.hpf: spine이 존재하지 않는 item을 참조합니다 - " + m2[1]);
      }
    } else errors.push("Contents/content.hpf가 생성되지 않았습니다.");

    var container = files["META-INF/container.xml"];
    if (container) {
      var reRoot = /full-path="([^"]+)"/g, m4;
      while ((m4 = reRoot.exec(container))) {
        if (!(m4[1] in files)) errors.push("container.xml: rootfile이 가리키는 파일이 없습니다 - " + m4[1]);
      }
    } else errors.push("META-INF/container.xml이 생성되지 않았습니다.");

    return errors;
  }

  /* opts: { title, author, bodyTitle, chapters: [{title, text}] } -- same shape DocxGenerator takes.
   * Returns a Uint8Array. Throws HwpxValidationError (with .errors) if the generated
   * package fails validateHwpxPackage(). */
  function generateHwpx(opts) {
    var title = opts.title || "제목 없음";
    var chapters = opts.chapters || [];

    var files = {};
    files["mimetype"] = HWPX_MIMETYPE;
    files["version.xml"] = HWPX_VERSION_XML;
    files["META-INF/container.xml"] = HWPX_CONTAINER_XML;
    files["META-INF/container.rdf"] = HWPX_CONTAINER_RDF;
    files["META-INF/manifest.xml"] = HWPX_MANIFEST_XML;
    files["settings.xml"] = HWPX_SETTINGS_XML;
    files["Contents/header.xml"] = buildHeaderXml();
    files["Contents/section0.xml"] = buildSectionXml(opts.bodyTitle, chapters);
    files["Contents/content.hpf"] = buildContentHpf(title, opts.author);
    files["Preview/PrvText.txt"] = buildPreviewText(chapters);

    var errors = validateHwpxPackage(files);
    if (errors.length) {
      var err = new Error("HWPX 유효성 검사 실패:\n" + errors.join("\n"));
      err.name = "HwpxValidationError";
      err.errors = errors;
      throw err;
    }

    var zip = new MiniZip();
    // mimetype must be the ZIP's first entry, stored uncompressed -- MiniZip always
    // stores (no deflate), so simply adding it first satisfies both requirements.
    zip.addFile("mimetype", files["mimetype"]);
    zip.addFile("version.xml", files["version.xml"]);
    zip.addFile("META-INF/container.xml", files["META-INF/container.xml"]);
    zip.addFile("META-INF/container.rdf", files["META-INF/container.rdf"]);
    zip.addFile("META-INF/manifest.xml", files["META-INF/manifest.xml"]);
    zip.addFile("settings.xml", files["settings.xml"]);
    zip.addFile("Contents/header.xml", files["Contents/header.xml"]);
    zip.addFile("Contents/section0.xml", files["Contents/section0.xml"]);
    zip.addFile("Contents/content.hpf", files["Contents/content.hpf"]);
    zip.addFile("Preview/PrvText.txt", files["Preview/PrvText.txt"]);
    return zip.generate();
  }

function buildManuscriptTxt(bodyTitle, chapters) {

    parts.push(""); parts.push("");
  });
  return parts.join("\n");
}

  function xmlEsc(s) {

/* ---- 이 앱의 데이터 모델 -> 내보내기용 데이터 변환 ---- */
/* opts: optional { categories: null|Array of "characters"|"organizations"|"locations"|"events"
 * |"items"|"settingsDocs"|"timelineGroups"|"races", characterIds: null|Array }. null/omitted
 * means "include everything", identical to the original always-everything behavior. */
function buildWorldBuildingData(workId, opts) {
  opts = opts || {};
  var cats = opts.categories || null;
  function wantCat(key) { return !cats || cats.indexOf(key) !== -1; }
  var work = WORKS.find(function (w) { return w.id === workId; });
  var workDocs = DOCS.filter(function (d) { return d.workId === workId; });
  var workGraphs = GRAPHS.filter(function (g) { return g.workId === workId; });
  var workMaps = MAPS.filter(function (m) { return m.workId === workId; });
  var workTimelines = TIMELINES.filter(function (t) { return t.workId === workId; });
  var workNovels = NOVELS.filter(function (n) { return n.workId === workId; });
  var novelIds = workNovels.map(function (n) { return n.id; });
  var workManuscripts = MANUSCRIPTS.filter(function (m) { return novelIds.indexOf(m.novelId) !== -1; });
  workManuscripts.forEach(function (m) { try { detectCharactersInManuscript(m, workId); } catch (e) {} });

  function edgeOtherNode(g, edge, docId) {
    var fromNode = g.nodes.find(function (n) { return n.id === edge.from; });
    var toNode = g.nodes.find(function (n) { return n.id === edge.to; });
    if (fromNode && fromNode.docId === docId) return toNode;
    if (toNode && toNode.docId === docId) return fromNode;
    return null;
  }
  function relationshipsForDoc(docId) {
    var rels = [];
    workGraphs.forEach(function (g) {
      g.edges.forEach(function (e) {
        var other = edgeOtherNode(g, e, docId);
        if (!other) return;
        var kindLabel = (EDGE_KINDS[e.kind] || {}).label || e.kind || "";
        rels.push({ name: other.label || "?", kind: kindLabel, memo: e.label || "", targetId: other.docId || null });
      });
    });
    return rels;
  }
  function nodeIdsForDoc(g, docId) {
    return g.nodes.filter(function (n) { return n.docId === docId; }).map(function (n) { return n.id; });
  }
  function orgMembersAndRivals(orgDoc) {
    var members = [], rivals = [];
    var memberIds = {}, rivalIds = {};
    function addMember(name, id) { if (!memberIds[name]) { memberIds[name] = true; members.push({ name: name, id: id || null }); } }
    function addRival(name, id) { if (!rivalIds[name]) { rivalIds[name] = true; rivals.push({ name: name, id: id || null }); } }
    workGraphs.forEach(function (g) {
      nodeIdsForDoc(g, orgDoc.id).forEach(function (orgNodeId) {
        g.edges.forEach(function (e) {
          if (e.from !== orgNodeId && e.to !== orgNodeId) return;
          var otherId = e.from === orgNodeId ? e.to : e.from;
          var otherNode = g.nodes.find(function (n) { return n.id === otherId; });
          if (!otherNode) return;
          if (e.kind === "affil") addMember(otherNode.label, otherNode.docId);
          if (e.kind === "hostile") addRival(otherNode.label, otherNode.docId);
        });
      });
    });
    workDocs.filter(function (d) { return d.category === "등장인물"; }).forEach(function (cd) {
      var hit = (cd.props || []).some(function (p) { return p.key === "소속" && p.value === orgDoc.title; });
      if (hit) addMember(cd.title, cd.id);
    });
    return { members: members, rivals: rivals };
  }
  function episodesForDoc(docId) {
    return workManuscripts.filter(function (m) { return (m.characterIds || []).indexOf(docId) !== -1; })
      .map(function (m) { return m.title || "제목 없음"; });
  }
  var CURATED_KEYS = ["나이", "생일", "성별", "종족", "신장", "몸무게", "능력", "무기", "소속", "직업", "성격", "목표"];
  function fieldsForDoc(d) {
    var out = [];
    var seen = {};
    CURATED_KEYS.forEach(function (k) {
      var p = (d.props || []).find(function (p) { return p.key === k; });
      if (p && p.value) { out.push({ k: k, v: String(p.value) }); seen[k] = true; }
    });
    (d.props || []).forEach(function (p) {
      if (!seen[p.key] && p.value) out.push({ k: p.key, v: String(p.value) });
    });
    return out;
  }

  var characterDocs = workDocs.filter(function (d) { return d.category === "등장인물"; });
  var characters = !wantCat("characters") ? [] : characterDocs
    .filter(function (d) { return !opts.characterIds || opts.characterIds.indexOf(d.id) !== -1; })
    .map(function (d) {
      var imageSvg = null;
      try { if (d.appearance) imageSvg = renderAppearanceSvg(d.appearance.system === "pixel_v1" ? d.appearance : migrateLegacyAppearance(d.appearance)); } catch (e) {}
      var raceProp = (d.props || []).find(function (p) { return p.key === "종족" && p.value; });
      return {
        id: d.id, title: d.title || "제목 없음", aliases: d.aliases || [], summary: d.summary || "",
        tags: d.tags || [], imageSvg: imageSvg, fields: fieldsForDoc(d), raceName: raceProp ? String(raceProp.value).trim() : null,
        relationships: relationshipsForDoc(d.id), episodes: episodesForDoc(d.id), blocks: d.blocks || []
      };
    });

  var organizations = !wantCat("organizations") ? [] : workDocs.filter(function (d) { return d.category === "세력"; }).map(function (d) {
    var mr = orgMembersAndRivals(d);
    return {
      id: d.id, title: d.title || "제목 없음", summary: d.summary || "",
      houseTypeLabel: d.houseType && HOUSE_TYPES[d.houseType] ? HOUSE_TYPES[d.houseType].label : "",
      color: d.color || "#8B8579", members: mr.members, rivals: mr.rivals, blocks: d.blocks || []
    };
  });

  var locations = [];
  if (wantCat("locations")) {
    workMaps.forEach(function (mp) {
      (mp.regions || []).forEach(function (r) {
        if (!r.label) return;
        var org = r.houseId ? workDocs.find(function (d) { return d.id === r.houseId; }) : null;
        locations.push({
          id: r.id, title: r.label,
          terrain: r.terrain === "none" ? "" : ((MAP_TERRAINS[r.terrain] || {}).label || ""),

        });
      });
    });
  }

  var events = !wantCat("events") ? [] : workDocs.filter(function (d) { return d.category === "사건"; }).map(function (d) {
    return { id: d.id, title: d.title || "제목 없음", summary: d.summary || "", blocks: d.blocks || [], relationships: relationshipsForDoc(d.id) };
  });

  var items = !wantCat("items") ? [] : workDocs.filter(function (d) { return d.category === "아이템"; }).map(function (d) {
    return { id: d.id, title: d.title || "제목 없음", summary: d.summary || "", blocks: d.blocks || [], fields: fieldsForDoc(d), relationships: relationshipsForDoc(d.id) };
  });

  var OTHER_CATS = ["세계관", "떡밥", "부·사이드", "기타"];
  var settingsDocs = !wantCat("settingsDocs") ? [] : workDocs.filter(function (d) { return OTHER_CATS.indexOf(d.category) !== -1; }).map(function (d) {
    return { id: d.id, title: d.title || "제목 없음", category: d.category, summary: d.summary || "", blocks: d.blocks || [] };
  });

  /* 종족은 이 앱에 별도 문서 타입이 없어서, 등장인물의 "종족" 속성값을 모아 그룹으로 파생합니다. */
  var raceOrder = [], raceMembers = {};
  if (wantCat("races")) {
    characterDocs.forEach(function (d) {
      var raceProp = (d.props || []).find(function (p) { return p.key === "종족" && p.value; });
      if (!raceProp) return;
      var raceName = String(raceProp.value).trim();
      if (!raceName) return;
      if (!raceMembers[raceName]) { raceMembers[raceName] = []; raceOrder.push(raceName); }
      raceMembers[raceName].push({ id: d.id, title: d.title || "제목 없음" });
    });
  }
  var races = raceOrder.map(function (name, i) {
    return { id: "race" + i, title: name, members: raceMembers[name] };
  });

  var timelineGroups = !wantCat("timelineGroups") ? [] : workTimelines.map(function (tl) {
    var evs = (tl.events || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    return { title: tl.title || "연표", events: evs.map(function (e) { return { label: e.label || "", title: e.title || "", description: e.description || "", eventId: e.docId || null }; }) };
  });

  /* 등장인물/조직/사건/아이템 id -> {kind, title}. 관계·연표에서 클릭 이동 가능한 위키 링크를 만들 때 사용. */
  var entityIndex = {};
  characters.forEach(function (c) { entityIndex[c.id] = { kind: "characters", title: c.title }; });
  organizations.forEach(function (o) { entityIndex[o.id] = { kind: "organizations", title: o.title }; });
  events.forEach(function (e) { entityIndex[e.id] = { kind: "events", title: e.title }; });
  items.forEach(function (it) { entityIndex[it.id] = { kind: "items", title: it.title }; });
  var raceIdByName = {};
  races.forEach(function (r) { raceIdByName[r.title] = r.id; });
  characters.forEach(function (c) { c.raceId = c.raceName ? (raceIdByName[c.raceName] || null) : null; });

  var readmeDoc = workDocs.find(function (d) { return d.category === "기타" && (d.tags || []).indexOf("readme") !== -1; });
  var totalChars = workManuscripts.reduce(function (s, m) { return s + charCount(m.text); }, 0);

  return {
    workTitle: (work && work.title) || "제목 없는 작품",
    readme: readmeDoc ? readmeDoc.blocks : null,
    stats: {
      characters: characters.length, organizations: organizations.length, locations: locations.length,
      races: races.length, items: items.length, events: events.length, manuscripts: totalChars
    },
    characters: characters, organizations: organizations, locations: locations, races: races, items: items,
    events: events, settingsDocs: settingsDocs, timelineGroups: timelineGroups,
    entityIndex: entityIndex, raceIdByName: raceIdByName
  };
}

/* chapters across every novel in a work (used for "전체 원고" combined export), or for one novel */
/* selection: optional { novelIds: null|Array, essayIds: null|Array } -- null (or omitted)
 * means "include all", same as the original always-everything behavior. Passing an
 * array (even empty) narrows to just those folder ids, powering the selective export UI. */
function collectExportChapters(workId, selection) {
  selection = selection || {};
  var novelIds = selection.novelIds;
  var essayIds = selection.essayIds;
  var novels = NOVELS.filter(function (n) { return n.workId === workId && (!novelIds || novelIds.indexOf(n.id) !== -1); });
  var chapters = [];
  novels.forEach(function (n) {
    var eps = MANUSCRIPTS.filter(function (m) { return m.novelId === n.id; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    eps.forEach(function (m) { chapters.push({ novelTitle: n.title || "제목 없는 소설", title: m.title || "제목 없음", text: m.text || "" }); });
  });
  /* 수필·자서전 entries flow through the exact same {novelTitle,title,text} shape
   * (novelTitle repurposed as the essay collection's title) so the existing
   * DOCX/PDF/HWPX/TXT generators don't need a parallel code path. */
  var essayCols = ESSAYS.filter(function (es) { return es.workId === workId && (!essayIds || essayIds.indexOf(es.id) !== -1); });
  essayCols.forEach(function (es) {
    var entries = ESSAY_ENTRIES.filter(function (e) { return e.essayId === es.id; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    entries.forEach(function (e) { chapters.push({ novelTitle: es.title || "제목 없는 폴더", title: e.title || "제목 없음", text: e.text || "" }); });
  });
  return chapters;
}

function safeFileName(s) {
  return String(s || "제목없음").replace(/[\\/:*?"<>|]/g, "_").trim().slice(0, 80) || "제목없음";
}
function pad3(n) { var s = String(n); while (s.length < 3) s = "0" + s; return s; }

/* Real-data-driven list of world-building categories this work actually has content in --
 * powers the export modal's "설정" checkbox tree. Categories with zero items are omitted
 * rather than hardcoded, so the list always matches what buildWorldBuildingData() would emit. */
function exportCategoryDefs(workId) {
  var workDocs = DOCS.filter(function (d) { return d.workId === workId; });
  var workMaps = MAPS.filter(function (m) { return m.workId === workId; });
  var workTimelines = TIMELINES.filter(function (t) { return t.workId === workId; });
  var charCount = workDocs.filter(function (d) { return d.category === "등장인물"; }).length;
  var orgCount = workDocs.filter(function (d) { return d.category === "세력"; }).length;
  var locCount = 0;
  workMaps.forEach(function (mp) { locCount += (mp.regions || []).filter(function (r) { return r.label; }).length; });
  var eventCount = workDocs.filter(function (d) { return d.category === "사건"; }).length;
  var itemCount = workDocs.filter(function (d) { return d.category === "아이템"; }).length;
  var settingsCount = workDocs.filter(function (d) { return ["세계관", "떡밥", "부·사이드", "기타"].indexOf(d.category) !== -1; }).length;
  var tlCount = workTimelines.length;
  var raceNames = {};
  workDocs.filter(function (d) { return d.category === "등장인물"; }).forEach(function (d) {
    var p = (d.props || []).find(function (p) { return p.key === "종족" && p.value; });
    if (p) raceNames[String(p.value).trim()] = true;
  });
  var raceCount = Object.keys(raceNames).length;
  var defs = [];
  if (charCount) defs.push({ key: "characters", label: "등장인물", count: charCount });
  if (orgCount) defs.push({ key: "organizations", label: "세력", count: orgCount });
  if (locCount) defs.push({ key: "locations", label: "지역", count: locCount });
  if (eventCount) defs.push({ key: "events", label: "사건", count: eventCount });
  if (itemCount) defs.push({ key: "items", label: "아이템", count: itemCount });
  if (settingsCount) defs.push({ key: "settingsDocs", label: "설정 문서", count: settingsCount });
  if (tlCount) defs.push({ key: "timelineGroups", label: "연표", count: tlCount });
  if (raceCount) defs.push({ key: "races", label: "종족", count: raceCount });
  return defs;
}

/* Manuscript folders (소설 + 수필·자서전) this work has, for the export modal's tree. */
function exportManuscriptFolderDefs(workId) {
  var novels = NOVELS.filter(function (n) { return n.workId === workId; }).map(function (n) {
    return { id: n.id, title: n.title || "제목 없는 소설", count: MANUSCRIPTS.filter(function (m) { return m.novelId === n.id; }).length, kind: "novel" };
  });
  var essayCols = ESSAYS.filter(function (es) { return es.workId === workId; }).map(function (es) {
    return { id: es.id, title: es.title || "제목 없는 폴더", count: ESSAY_ENTRIES.filter(function (e) { return e.essayId === es.id; }).length, kind: "essay" };
  });
  return novels.concat(essayCols).filter(function (f) { return f.count > 0; });
}

/* ---------------- ExportService: orchestrator ----------------
 * 작가가 받는 결과물은 최대한 단순해야 한다: ZIP 안에는 원고 파일(들)과 설정집.html만 있고,
 * 폴더 구조나 부속 파일은 만들지 않는다.
 *   ProjectName.zip
 *     원고.docx            (scope: combined)
 *     또는 001화.docx, 002화.docx, ...  (scope: perEpisode)
 *     설정집.html
 * 선택적 내보내기: opts.includeManuscript/includeWorldBuilding으로 두 축을 독립적으로 켜고 끌 수 있고,
 * opts.novelIds/essayIds, opts.wbCategories/wbCharacterIds로 각 축 내부에서도 세부 항목을 고를 수 있다.
 * 모두 생략(=null)하면 예전과 동일하게 "전체"를 의미하므로 기존 호출부·기존 동작은 100% 그대로 유지된다.
 * 설정만 선택하고 원고를 뺀 경우에는 ZIP으로 묶지 않고 설정집.html 하나만 바로 내려받는다(=단일 HTML 내보내기).
 */
var ExportService = {
  /* format: 'docx'|'pdf'|'hwpx'|'txt', scope: 'combined'|'perEpisode' */
  run: async function (workId, opts) {
    var work = WORKS.find(function (w) { return w.id === workId; });
    var workTitle = (work && work.title) || "작품";
    var includeManuscript = opts.includeManuscript !== false;
    var includeWorldBuilding = !!opts.includeWorldBuilding;
    var chapters = includeManuscript
      ? collectExportChapters(workId, { novelIds: opts.novelIds || null, essayIds: opts.essayIds || null })
      : [];

    if (!includeManuscript && includeWorldBuilding) {
      var wbOnlyData = buildWorldBuildingData(workId, { categories: opts.wbCategories || null, characterIds: opts.wbCharacterIds || null });
      var htmlOnly = generateSettingsHtml(wbOnlyData);
      var htmlBlob = new Blob([htmlOnly], { type: "text/html" });
      var htmlUrl = URL.createObjectURL(htmlBlob);
      var htmlA = document.createElement("a");
      htmlA.href = htmlUrl; htmlA.download = safeFileName(workTitle) + "_설정집.html";
      document.body.appendChild(htmlA); htmlA.click(); document.body.removeChild(htmlA);
      setTimeout(function () { URL.revokeObjectURL(htmlUrl); }, 1000);
      return;
    }

    var zip = new MiniZip();

    if (chapters.length) {
      if (opts.scope === "perEpisode") {
        for (var i = 0; i < chapters.length; i++) {
          await ExportService._writeChapterFile(zip, pad3(i + 1) + "화", [chapters[i]], opts.format, null);
        }
      } else {
        await ExportService._writeChapterFile(zip, "원고", chapters, opts.format, workTitle);
      }
    }

    if (includeWorldBuilding) {
      var wbData = buildWorldBuildingData(workId, { categories: opts.wbCategories || null, characterIds: opts.wbCharacterIds || null });
      var html = generateSettingsHtml(wbData);
      zip.addFile("설정집.html", html);
    }

    if (!chapters.length && !includeWorldBuilding) return;

    var zipBytes = zip.generate();
    var blob = new Blob([zipBytes], { type: "application/zip" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = safeFileName(workTitle) + ".zip";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  },

  /* fileBase: file name without extension, written at the ZIP root (no subfolders). */
  _writeChapterFile: async function (zip, fileBase, chaptersSlice, format, bodyTitle) {
    if (format === "txt") {
      zip.addFile(fileBase + ".txt", buildManuscriptTxt(bodyTitle, chaptersSlice));
    } else if (format === "docx") {
      var docxBytes = generateDocx({ title: bodyTitle || fileBase, author: "집썰", bodyTitle: bodyTitle, chapters: chaptersSlice });
      zip.addFile(fileBase + ".docx", docxBytes);
    } else if (format === "hwpx") {
      var hwpxBytes = generateHwpx({ title: bodyTitle || fileBase, author: "집썰", bodyTitle: bodyTitle, chapters: chaptersSlice });
      zip.addFile(fileBase + ".hwpx", hwpxBytes);
    } else if (format === "pdf") {
      var pages = await rasterizeChaptersToPdfPages(chaptersSlice, {});
      var pdfBytes = generatePdf(pages, { title: bodyTitle || fileBase });
      zip.addFile(fileBase + ".pdf", pdfBytes);
    }
  }
};

/* ---------------- UI: export modal ----------------
 * 기본값(범위="전체 프로젝트")은 예전 동작과 동일하게 모든 원고+설정을 내보낸다.
 * "선택 항목만"을 고르면 원고 폴더별/설정 카테고리별(+등장인물은 개별)로 체크박스 트리가 나타난다.
 * 원고를 빼고 설정만 고르면 ZIP 없이 설정집.html 하나만 바로 내려받는다. */
function openExportZipModal(workId) {
  var work = WORKS.find(function (w) { return w.id === workId; });
  if (!work) return;
  var manuscriptFolders = exportManuscriptFolderDefs(workId);
  var hasChapters = manuscriptFolders.length > 0;
  var wbCats = exportCategoryDefs(workId);
  var hasWorldBuilding = wbCats.length > 0;
  var hasCharCat = wbCats.some(function (c) { return c.key === "characters"; });
  var characterDocs = DOCS.filter(function (d) { return d.workId === workId && d.category === "등장인물"; });

  if (!hasChapters && !hasWorldBuilding) {
    openModal({ title: '"' + (work.title || "제목 없음") + '" 내보내기', message: "이 작품에는 아직 내보낼 원고나 설정 데이터가 없어요.", confirmLabel: "확인" });
    return;
  }

  openModal({ title: '"' + (work.title || "제목 없음") + '" 내보내기' });
  var overlay = document.getElementById("modalOverlay");
  if (!overlay) return;
  var box = overlay.querySelector(".modal-box");
  box.classList.add("wide");
  var actionsDiv = box.querySelector(".modal-actions");
  var defaultOk = document.getElementById("modalOk");
  if (defaultOk) defaultOk.remove();

  function treeItemHtml(group, id, title, suffix, indent) {
    return '<label class="exp-tree-item' + (indent ? " indent" : "") + '"><input type="checkbox" class="exp-check" data-expgroup="' + group + '" data-expid="' + esc(id) + '" checked><span>' + esc(title) + '</span>' + (suffix ? '<span class="exp-count">' + esc(suffix) + "</span>" : "") + "</label>";
  }

  var msTreeHtml = "";
  if (hasChapters) {
    msTreeHtml =
      '<label class="modal-check exp-toggle"><input type="checkbox" id="expIncludeMs" checked> 원고 포함</label>' +
      '<div class="exp-tree" id="expMsTree">' +
        '<label class="exp-tree-item exp-tree-master"><input type="checkbox" class="exp-selall" data-expselall="ms" checked><span>전체 선택</span></label>' +
        manuscriptFolders.map(function (f) { return treeItemHtml("ms", f.id, f.title, "· " + f.count + (f.kind === "novel" ? "화" : "편")); }).join("") +
      "</div>";
  }

  var wbTreeHtml = "";
  if (hasWorldBuilding) {
    wbTreeHtml =
      '<label class="modal-check exp-toggle"><input type="checkbox" id="expIncludeWb" checked> 설정(세계관) 포함</label>' +
      '<div class="exp-tree" id="expWbTree">' +
        '<label class="exp-tree-item exp-tree-master"><input type="checkbox" class="exp-selall" data-expselall="wb" checked><span>전체 선택</span></label>' +
        wbCats.map(function (c) { return treeItemHtml("wb", c.key, c.label, "· " + c.count + "개"); }).join("") +
        (hasCharCat && characterDocs.length ? (
          '<div class="exp-tree-sub" id="expCharSub">' +
            '<div class="exp-tree-subhead"><span>등장인물 세부 선택</span><button type="button" class="exp-selall-btn" data-expselallbtn="char">전체 선택</button></div>' +
            characterDocs.map(function (d) { return treeItemHtml("char", d.id, d.title || "제목 없음", "", true); }).join("") +
          "</div>"
        ) : "") +
      "</div>";
  }

  var formatHtml = "";
  if (hasChapters) {
    formatHtml =
      '<div class="modal-picker-label">원고 형식</div>' +
      '<div class="modal-picker-row" id="expFormatRow">' +
        ["docx", "pdf", "hwpx", "txt"].map(function (v) { return '<button type="button" class="modal-pick no-dot' + (v === "docx" ? " on" : "") + '" data-expformat="' + v + '">' + v.toUpperCase() + "</button>"; }).join("") +
      "</div>" +
      '<div class="modal-picker-label">원고 내보내기 방식</div>' +
      '<div class="modal-picker-row" id="expScopeRow">' +
        '<button type="button" class="modal-pick no-dot on" data-expmsscope="combined">전체 원고 하나</button>' +
        '<button type="button" class="modal-pick no-dot" data-expmsscope="perEpisode">회차별 파일</button>' +
      "</div>";
  }

  var bodyHtml =
    '<div class="modal-picker-label">내보낼 범위</div>' +
    '<div class="modal-picker-row">' +
      '<button type="button" class="modal-pick no-dot on" data-expscope="all">전체 프로젝트</button>' +
      '<button type="button" class="modal-pick no-dot" data-expscope="select">선택 항목만</button>' +
    "</div>" +
    '<div class="modal-msg" id="expScopeHint">모든 원고와 설정을 그대로 담아 내보내요.</div>' +
    '<div class="exp-select-area" id="expSelectArea" style="display:none">' + msTreeHtml + wbTreeHtml + "</div>" +
    formatHtml;

  actionsDiv.insertAdjacentHTML("beforebegin", bodyHtml);
  actionsDiv.insertAdjacentHTML("beforeend", '<button type="button" class="btn primary" id="expConfirmBtn">내보내기</button>');

  var scope = "all";
  var selectArea = document.getElementById("expSelectArea");
  var scopeHint = document.getElementById("expScopeHint");
  box.querySelectorAll("[data-expscope]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      scope = btn.dataset.expscope;
      box.querySelectorAll("[data-expscope]").forEach(function (b) { b.classList.toggle("on", b === btn); });
      selectArea.style.display = scope === "select" ? "" : "none";
      scopeHint.style.display = scope === "select" ? "none" : "";
    });
  });

  var msIncludeEl = document.getElementById("expIncludeMs");
  var msTreeEl = document.getElementById("expMsTree");
  if (msIncludeEl) msIncludeEl.addEventListener("change", function () { msTreeEl.style.display = msIncludeEl.checked ? "" : "none"; });
  var wbIncludeEl = document.getElementById("expIncludeWb");
  var wbTreeEl = document.getElementById("expWbTree");
  if (wbIncludeEl) wbIncludeEl.addEventListener("change", function () { wbTreeEl.style.display = wbIncludeEl.checked ? "" : "none"; });

  function updateCharSubVisibility() {
    var sub = document.getElementById("expCharSub");
    if (!sub) return;
    var cb = box.querySelector('.exp-check[data-expgroup="wb"][data-expid="characters"]');
    sub.style.display = cb && cb.checked ? "" : "none";
  }
  updateCharSubVisibility();
  var charCatCb = box.querySelector('.exp-check[data-expgroup="wb"][data-expid="characters"]');
  if (charCatCb) charCatCb.addEventListener("change", updateCharSubVisibility);

  box.querySelectorAll("[data-expselall]").forEach(function (master) {
    master.addEventListener("change", function () {
      var group = master.dataset.expselall;
      box.querySelectorAll('.exp-check[data-expgroup="' + group + '"]').forEach(function (cb) { cb.checked = master.checked; });
      updateCharSubVisibility();
    });
  });
  box.querySelectorAll("[data-expselallbtn]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var group = btn.dataset.expselallbtn;
      var boxes = box.querySelectorAll('.exp-check[data-expgroup="' + group + '"]');
      var allOn = Array.prototype.every.call(boxes, function (cb) { return cb.checked; });
      boxes.forEach(function (cb) { cb.checked = !allOn; });
    });
  });

  var pickedFormat = "docx", pickedMsScope = "combined";
  box.querySelectorAll("[data-expformat]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      pickedFormat = btn.dataset.expformat;
      box.querySelectorAll("[data-expformat]").forEach(function (b) { b.classList.toggle("on", b === btn); });
    });
  });
  box.querySelectorAll("[data-expmsscope]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      pickedMsScope = btn.dataset.expmsscope;
      box.querySelectorAll("[data-expmsscope]").forEach(function (b) { b.classList.toggle("on", b === btn); });
    });
  });

  document.getElementById("expConfirmBtn").addEventListener("click", function () {
    var includeManuscript = hasChapters && (scope === "all" || !msIncludeEl || msIncludeEl.checked);
    var includeWorldBuilding = hasWorldBuilding && (scope === "all" || !wbIncludeEl || wbIncludeEl.checked);
    var novelIds = null, essayIds = null, wbCategories = null, wbCharacterIds = null;

    if (scope === "select") {
      if (includeManuscript) {
        var checkedMs = Array.prototype.filter.call(box.querySelectorAll('.exp-check[data-expgroup="ms"]'), function (cb) { return cb.checked; }).map(function (cb) { return cb.dataset.expid; });
        novelIds = manuscriptFolders.filter(function (f) { return f.kind === "novel" && checkedMs.indexOf(f.id) !== -1; }).map(function (f) { return f.id; });
        essayIds = manuscriptFolders.filter(function (f) { return f.kind === "essay" && checkedMs.indexOf(f.id) !== -1; }).map(function (f) { return f.id; });
        if (!checkedMs.length) includeManuscript = false;
      }
      if (includeWorldBuilding) {
        var checkedWb = Array.prototype.filter.call(box.querySelectorAll('.exp-check[data-expgroup="wb"]'), function (cb) { return cb.checked; }).map(function (cb) { return cb.dataset.expid; });
        wbCategories = checkedWb;
        if (!checkedWb.length) includeWorldBuilding = false;
        if (checkedWb.indexOf("characters") !== -1) {
          wbCharacterIds = Array.prototype.filter.call(box.querySelectorAll('.exp-check[data-expgroup="char"]'), function (cb) { return cb.checked; }).map(function (cb) { return cb.dataset.expid; });
        }
      }
    }

    if (!includeManuscript && !includeWorldBuilding) {
      openModal({ title: "내보낼 항목을 선택해주세요", message: "원고와 설정 중 최소 한 가지는 포함해야 내보낼 수 있어요.", confirmLabel: "확인" });
      return;
    }

    var opts = {
      format: pickedFormat, scope: pickedMsScope,
      includeManuscript: includeManuscript, includeWorldBuilding: includeWorldBuilding,
      novelIds: novelIds, essayIds: essayIds, wbCategories: wbCategories, wbCharacterIds: wbCharacterIds
    };
    openModal({ title: "내보내는 중...", message: "잠시만 기다려주세요. 데이터 분량이 많으면 몇 초 정도 걸릴 수 있어요.", confirmLabel: "" });
    var okBtn2 = document.getElementById("modalOk"); if (okBtn2) okBtn2.style.display = "none";
    var cancelBtn2 = document.getElementById("modalCancel"); if (cancelBtn2) cancelBtn2.style.display = "none";
    ExportService.run(workId, opts).then(function () {
      closeModal();
    }).catch(function (err) {
      closeModal();
      openModal({ title: "내보내기 실패", message: "문제가 발생했어요: " + (err && err.message ? err.message : String(err)), confirmLabel: "확인" });
    });
  });
}

render();
</script>
