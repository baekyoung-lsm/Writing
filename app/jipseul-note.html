  /* Visual tone matched to the 설정집(wiki export) palette -- same token names as
   * before so every existing rule (var(--bg), var(--ink), ...) picks it up without
   * per-selector edits. --tide/--rose/--moss stay untouched: those are semantic
   * status colors (alive/danger/resolved badges etc.), not part of the background/
   * ink/accent "tone" this pass is about. */
  :root {
    --bg: #faf9f6; --bg-panel: #f4f3ef; --bg-card: #ffffff; --bg-card-hover: #f4f3ef;
    --ink: #17181c; --ink-soft: #4b4d55; --ink-faint: #8a8c94;
    --border: #e6e4dd; --border-strong: #d8d5cb;
    --accent: #3B82F6; --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-strong: color-mix(in srgb, var(--accent) 82%, black);
    --tide: #357C82; --tide-soft: rgba(53,124,130,0.14);
    --rose: #A6473C; --rose-soft: rgba(166,71,60,0.13);
    --moss: #3F6B34; --moss-soft: rgba(63,107,52,0.14);
    --shadow: rgba(20,20,15,0.08);
    --radius: 12px;
    --serif: "Noto Serif KR","Nanum Myeongjo","Batang",serif;
    --sans: "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --bg-panel: #1b1c1f; --bg-card: #1f2023; --bg-card-hover: #26282b;
      --ink: #eceef0; --ink-soft: #b7bac0; --ink-faint: #74777d;
      --border: #2c2e32; --border-strong: #383b40;
      --accent-strong: color-mix(in srgb, var(--accent) 78%, white);
      --tide: #7FBAC7; --tide-soft: rgba(127,186,199,0.14);
      --rose: #D9776A; --rose-soft: rgba(217,119,106,0.16);
      --moss: #93B87A; --moss-soft: rgba(147,184,122,0.16);
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#17181a; --bg-panel:#1b1c1f; --bg-card:#1f2023; --bg-card-hover:#26282b;
    --ink:#eceef0; --ink-soft:#b7bac0; --ink-faint:#74777d;
    --border:#2c2e32; --border-strong:#383b40;
    --accent-strong: color-mix(in srgb, var(--accent) 78%, white);
    --tide:#7FBAC7; --tide-soft:rgba(127,186,199,0.14);
    --rose:#D9776A; --rose-soft:rgba(217,119,106,0.16);
    --moss:#93B87A; --moss-soft:rgba(147,184,122,0.16);
    --shadow:rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg:#faf9f6; --bg-panel:#f4f3ef; --bg-card:#ffffff; --bg-card-hover:#f4f3ef;
    --ink:#17181c; --ink-soft:#4b4d55; --ink-faint:#8a8c94;
    --border:#e6e4dd; --border-strong:#d8d5cb;
    --accent-strong: color-mix(in srgb, var(--accent) 82%, black);
    --tide:#357C82; --tide-soft:rgba(53,124,130,0.14);
    --rose:#A6473C; --rose-soft:rgba(166,71,60,0.13);
    --moss:#3F6B34; --moss-soft:rgba(63,107,52,0.14);
    --shadow:rgba(20,20,15,0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  input, textarea, select, button { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--accent-soft); }

  /* ---------- 일반 집필창 (워드/HWP 스타일) ---------- */
  .ms-doc-page { width:100%; max-width:820px; margin:0 auto; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; box-shadow:0 2px 16px var(--shadow); overflow:hidden; }
  .ms-doc-ruler { height:18px; background:repeating-linear-gradient(to right, var(--border) 0 1px, transparent 1px 40px); border-bottom:1px solid var(--border); }
  .ms-doc-screen { }
  .ms-doc-textarea { width:100%; min-height:640px; height:auto; resize:vertical; box-sizing:border-box; }

  /* ---------- 목표 글자수 / 저장 표시 / 이전 화 이어보기 ---------- */
  .ms-goal-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .ms-goal-label { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-faint); flex:none; }
  .ms-goal-input { width:88px; border:1px solid var(--border-strong); border-radius:6px; padding:4px 7px; font-size:12px; background:var(--bg-card); color:var(--ink); }
  .ms-goal-bar-wrap { display:flex; align-items:center; gap:8px; flex:1; min-width:120px; }
  .ms-goal-bar-track { flex:1; height:6px; border-radius:4px; background:var(--border); overflow:hidden; min-width:80px; }
  .ms-goal-bar-fill { height:100%; background:var(--accent); border-radius:4px; }
  .ms-goal-bar-fill.done { background:var(--moss, #5E7A3A); }
  .ms-goal-pct { font-size:11.5px; color:var(--ink-faint); flex:none; font-variant-numeric:tabular-nums; }
  .ms-save-indicator { font-size:11px; color:var(--ink-faint); flex:none; }
  .ms-save-indicator.saved { color:var(--moss, #5E7A3A); }
  .ms-peek { margin-bottom:12px; }
  .ms-peek-toggle { display:flex; align-items:center; gap:5px; background:none; border:none; padding:4px 0; font-size:12px; color:var(--accent); }
  .ms-peek-toggle .icon, .ms-peek-toggle svg { transition:transform .15s; }
  .ms-peek-toggle.open svg { transform:rotate(90deg); }
  .ms-peek-body { margin-top:6px; padding:10px 12px; border:1px dashed var(--border-strong); border-radius:8px; font-size:12.5px; line-height:1.6; color:var(--ink-faint); background:var(--bg-card); white-space:pre-wrap; }

  /* ---------- 집중 모드 ---------- */
  .app.focus-mode { grid-template-columns:1fr; }
  .app.focus-mode .sidebar { display:none; }
  .app.focus-mode .page-pad { max-width:900px; margin:0 auto; }

  /* ---------- book mode (양장본) ---------- */
  .book-outer { display:flex; justify-content:center; padding:6px 0 22px; overflow-x:auto; }
  .book-mode-toggle { display:flex; gap:6px; justify-content:center; margin-bottom:12px; }
  .book-mode-toggle button { border:1px solid var(--border-strong); background:var(--bg-card); border-radius:20px; padding:6px 14px; font-size:12.5px; color:var(--ink-soft); }
  .book-mode-toggle button.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:600; }
  .book-shell { width:410px; flex:none; height:620px; background:#F7F1E3; border-radius:3px 9px 9px 3px; position:relative; overflow:hidden; box-shadow: -7px 0 0 #2A2015, -10px 5px 22px rgba(0,0,0,0.35), 0 12px 26px rgba(0,0,0,0.22); }
  .book-shell::before { content:""; position:absolute; left:0; top:0; bottom:0; width:16px; background:linear-gradient(90deg, rgba(0,0,0,0.30), rgba(0,0,0,0)); pointer-events:none; z-index:2; }
  .book-shell.spread { width:728px; flex:none; border-radius:5px; box-shadow: 0 5px 22px rgba(0,0,0,0.35), 0 12px 26px rgba(0,0,0,0.22); }
  .book-shell.spread::before { display:none; }
  .book-spread-inner { display:flex; height:100%; position:relative; }
  .book-spread-inner::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:22px; margin-left:-11px; background:linear-gradient(90deg, rgba(0,0,0,0.16), rgba(0,0,0,0.03) 40%, rgba(0,0,0,0.03) 60%, rgba(0,0,0,0.16)); pointer-events:none; }
  .book-page-content { padding:38px 32px 30px 40px; height:100%; box-sizing:border-box; overflow:hidden; font-family:var(--serif); font-size:15.5px; line-height:2.05; color:#2A2015; transition:transform .18s ease, opacity .18s ease; }
  .book-page-content.spread-page { width:50%; flex:none; padding:38px 28px 30px 34px; }
  .book-page-content.spread-page.right { padding:38px 34px 30px 28px; }
  .book-page-content p { text-indent:1em; text-align:justify; margin:0 0 0.85em; }
  .book-page-content.fo-next { transform:translateX(-16px); opacity:0; }
  .book-page-content.fo-prev { transform:translateX(16px); opacity:0; }
  .book-edit-textarea { width:100%; height:100%; border:none; outline:none; resize:none; box-sizing:border-box; padding:38px 32px 30px 40px; background:transparent; font-family:var(--serif); font-size:15.5px; line-height:2.05; color:#2A2015; text-align:justify; }
  .book-edit-flow { width:100%; height:100%; box-sizing:border-box; outline:none; background:transparent; font-family:var(--serif); font-size:15.5px; line-height:2.05; color:#2A2015; white-space:pre-wrap; word-wrap:break-word; }
  .book-edit-flow.spread { column-width:288px; column-gap:56px; column-fill:auto; overflow-x:auto; overflow-y:hidden; padding:38px 34px 30px 40px; text-align:justify; }
  .book-shell.spread .book-edit-flow-wrap { position:absolute; inset:0; }
  .book-shell.spread .book-edit-flow-wrap::after { content:""; position:absolute; top:0; bottom:0; left:50%; width:1px; background:rgba(0,0,0,0.12); pointer-events:none; z-index:1; }
  .book-nav { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:14px; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .book-nav button { background:var(--bg-card); border:1px solid var(--border-strong); border-radius:7px; padding:7px 14px; color:var(--ink); }
  .book-nav button:disabled { opacity:.35; }
  .book-hint { text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:8px; }

  /* body blocks */
  .blocks { display:flex; flex-direction:column; }
  .block { display:flex; align-items:flex-start; gap:6px; position:relative; padding: 3px 0; }
  .block-tools { display:flex; gap:2px; opacity:0; flex:none; padding-top:6px; }
  .block:hover .block-tools { opacity:1; }
  .block-tools button { display:flex; background:none; border:none; padding:4px; border-radius:5px; color:var(--ink-faint); }
  .block-tools button:hover { color:var(--accent); background:var(--bg-card); }
  .block-h { font-family:var(--serif); font-size:20px; font-weight:600; }
  .block-p { font-size:14.5px; color:var(--ink); }
  .add-block { display:flex; align-items:center; gap:7px; color:var(--ink-faint); font-size:13px; padding:8px 0 8px 32px; background:none; border:none; }
  .add-block:hover { color:var(--accent); }

  /* ---------- Graph page ---------- */
  .graph-shell { display:flex; flex-direction:column; height:100vh; }
  .graph-title-bar { display:flex; align-items:center; gap:10px; padding:16px 22px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .graph-title { font-family:var(--serif); font-size:18px; font-weight:600; border:none; background:none; outline:none; flex:1; }
  .graph-hint { font-size:11.5px; color:var(--ink-faint); }
  .ms-char-count { font-size:12px; color:var(--ink-faint); flex:none; font-variant-numeric:tabular-nums; }
  .graph-canvas-wrap { position:relative; flex:1; overflow:hidden; background:
      radial-gradient(circle, var(--border) 1px, transparent 1px) 0 0/22px 22px, var(--bg); cursor:grab; }
  .graph-canvas-wrap.panning { cursor:grabbing; }
  .graph-canvas-wrap.connecting { cursor:crosshair; }
  .graph-svg { width:100%; height:100%; display:block; }
  .gnode rect.gnode-box { fill:var(--bg-card); stroke:var(--border-strong); stroke-width:1.6; }
  .gnode.linked rect.gnode-box { stroke-width:2.2; }
  .gnode.selected rect.gnode-box { stroke-width:2.6; }
  .gnode text { fill:var(--ink); font-family:var(--sans); font-size:12.5px; }
  .gnode circle.gnode-dot { stroke:none; }
  .gnode { cursor:pointer; }
  .gnode-del { opacity:0; cursor:pointer; }
  .gnode:hover .gnode-del, .gnode.selected .gnode-del { opacity:1; }
  .gnode-del circle { fill:var(--rose); }
  .gnode-del line { stroke:#fff; stroke-width:1.4; }
  .gedge line.gedge-line { stroke-width:1.6; }
  .gedge.dashed line.gedge-line { stroke-dasharray:5 4; }
  .gedge.selected line.gedge-line { stroke-width:2.4; }
  .gedge rect.lbl-bg { fill:var(--bg); stroke:var(--border); }
  .gedge text.lbl-text { fill:var(--ink-soft); font-size:11px; font-family:var(--sans); }
  .gedge { cursor:pointer; }
  .gedge-del { opacity:0; cursor:pointer; }
  .gedge:hover .gedge-del { opacity:1; }
  .gedge-del circle { fill:var(--rose); }
  .gedge-del line { stroke:#fff; stroke-width:1.4; }
  .gedge-memo circle { fill:var(--bg-card); stroke:var(--border-strong); stroke-width:1.2; }
  .gedge-memo path { stroke:var(--tide); fill:none; stroke-width:1.3; }

  .graph-toolbar { position:absolute; left:16px; bottom:16px; display:flex; align-items:center; gap:2px; background:var(--bg-card); border:1px solid var(--border-strong); border-radius:10px; padding:5px; box-shadow:0 4px 14px var(--shadow); }
  .tb-btn { display:flex; align-items:center; gap:6px; background:none; border:none; padding:8px; border-radius:7px; color:var(--ink-soft); font-size:12px; }
  .tb-btn:hover { background:var(--bg-card-hover); color:var(--ink); }
  .tb-btn.active { background:var(--accent-soft); color:var(--accent); }
  .tb-sep { width:1px; align-self:stretch; background:var(--border); margin:4px 2px; }
  .graph-empty-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:var(--ink-faint); font-size:13px; pointer-events:none; }

  /* ---------- map ---------- */
  .graph-canvas-wrap.map-drawing { cursor:crosshair; }
  .map-terrain-row { position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; gap:5px; max-width:calc(100% - 32px); background:var(--bg-card); border:1px solid var(--border-strong); border-radius:10px; padding:6px; box-shadow:0 4px 14px var(--shadow); }
  .map-terrain-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-strong); background:var(--bg); border-radius:20px; padding:5px 11px; font-size:12px; color:var(--ink-soft); }
  .map-crop-hint { font-size:12px; color:var(--ink-soft); padding:5px 4px; white-space:nowrap; }
  .map-crop-preview { fill:var(--accent-soft); fill-opacity:0.28; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:6 4; pointer-events:none; }
  .map-scale-line-preview { stroke:var(--accent); stroke-width:2.5; stroke-dasharray:4 3; pointer-events:none; }
  .map-rotate-val { font-size:12px; color:var(--ink-soft); min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
  #mapRotateSlider { width:120px; accent-color:var(--accent); }
  .map-terrain-btn::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--tc); flex:none; }
  .map-terrain-btn.on { border-color:var(--tc); color:var(--ink); background:var(--bg-card-hover); font-weight:600; }
  .map-region polygon { fill-opacity:0.42; stroke-width:1.6; stroke-opacity:0.85; cursor:pointer; }
  .map-region.selected polygon { stroke-width:3; fill-opacity:0.55; }
  .map-region-label { fill:var(--ink); font-family:var(--sans); font-size:12px; font-weight:600; paint-order:stroke; stroke:var(--bg-card); stroke-width:3px; pointer-events:none; }
  .map-region-house-label { font-family:var(--sans); font-size:11px; font-weight:600; paint-order:stroke; stroke:var(--bg-card); stroke-width:3px; pointer-events:none; }
  .region-tooltip { position:fixed; z-index:200; background:var(--bg-card-hover); border:1px solid var(--border-strong); border-radius:10px; padding:12px 14px; box-shadow:0 8px 24px var(--shadow); max-width:240px; pointer-events:none; display:none; }
  .region-tooltip-title { font-family:var(--serif); font-weight:600; font-size:14px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .region-tooltip-row { display:flex; gap:8px; font-size:12px; padding:2px 0; }
  .region-tooltip-row .rt-k { color:var(--ink-faint); flex:none; width:68px; }
  .region-tooltip-row .rt-v { color:var(--ink); flex:1; min-width:0; }
  .map-region-focus { cursor:pointer; }
  .map-region-focus circle { stroke:#fff; stroke-width:1.6; opacity:0.92; }
  .map-region-focus:hover circle { opacity:1; }
  .map-line polyline { fill:none; stroke-width:3; cursor:pointer; }
  .map-line.selected polyline { stroke-width:4.5; }
  .map-line-label { fill:var(--ink); font-family:var(--sans); font-size:11.5px; font-weight:600; paint-order:stroke; stroke:var(--bg-card); stroke-width:3px; pointer-events:none; }
  .map-draw-preview { stroke:var(--accent); stroke-width:2.5; stroke-dasharray:5 4; fill:none; }
  .map-draw-preview.fill-preview { fill:var(--accent-soft); }
  .map-symbol-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-strong); background:var(--bg); border-radius:20px; padding:5px 11px; font-size:12px; color:var(--ink-soft); }
  .map-symbol-btn.on { border-color:var(--tc); color:var(--ink); background:var(--bg-card-hover); font-weight:600; }
  .map-marker { cursor:pointer; }
  .map-marker-bg { fill:var(--mc); stroke:#fff; stroke-width:1.6; }
  .map-marker.selected .map-marker-bg { stroke:var(--ink); stroke-width:2.6; }

  /* ---------- database table ---------- */
  .db-scroll { overflow-x:auto; padding-bottom:10px; }
  .db-table { border-collapse:collapse; font-size:13.5px; min-width:100%; }
  .db-table th, .db-table td { border:1px solid var(--border); padding:0; }
  .db-table th { background:var(--bg-panel); text-align:left; padding:8px 10px; font-size:12px; color:var(--ink-soft); white-space:nowrap; position:relative; }
  .db-table th .col-icon { color:var(--ink-faint); margin-right:5px; }
  .db-table th .col-name { cursor:text; border-radius:4px; padding:1px 3px; }
  .db-table th .col-name input { border:none; background:var(--bg-card); font-size:12px; color:var(--ink); outline:none; width:100%; }
  .db-table th .col-del { position:absolute; right:4px; top:50%; transform:translateY(-50%); opacity:0; color:var(--ink-faint); background:none; border:none; padding:3px; border-radius:5px; }
  .db-table th:hover .col-del { opacity:1; }
  .db-table th .col-del:hover { color:var(--rose); background:var(--rose-soft); }
  .db-table th.col-add-th { background:none; border:none; }
  .db-table th.col-add-th button { display:flex; align-items:center; justify-content:center; width:100%; height:100%; padding:8px; color:var(--ink-faint); background:none; border:none; }
  .db-table th.col-add-th button:hover { color:var(--accent); background:var(--bg-card); }
  .db-table td { vertical-align:top; min-width:120px; position:relative; }
  .db-table tr:hover td { background:var(--bg-card); }
  .cell-input { width:100%; border:none; background:none; outline:none; padding:8px 10px; font-size:13.5px; color:var(--ink); box-sizing:border-box; }
  .cell-input:focus { background:var(--bg-card-hover); }
  .cell-check-wrap { display:flex; align-items:center; justify-content:center; padding:8px; }
  .cell-multi { display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding:6px 8px; min-height:34px; cursor:pointer; }
  .cell-tag { font-size:11.5px; padding:2px 8px; border-radius:10px; color:#fff; }
  .cell-multi-empty { color:var(--ink-faint); font-size:12px; }
  .row-del-cell { width:30px; text-align:center; background:none !important; border:none !important; }
  .row-del-cell button { opacity:0; color:var(--ink-faint); background:none; border:none; padding:4px; border-radius:5px; }
  .db-table tr:hover .row-del-cell button { opacity:1; }
  .row-del-cell button:hover { color:var(--rose); background:var(--rose-soft); }
  .add-row-btn { display:flex; align-items:center; gap:6px; color:var(--ink-faint); font-size:13px; padding:9px 10px; background:none; border:1px solid var(--border); border-top:none; width:100%; text-align:left; }
  .add-row-btn:hover { color:var(--accent); background:var(--bg-card); }
  .multi-pop { position:absolute; z-index:30; top:100%; left:0; margin-top:2px; background:var(--bg-card-hover); border:1px solid var(--border-strong); border-radius:9px; padding:10px; width:220px; box-shadow:0 10px 26px var(--shadow); }
  .multi-pop input { width:100%; border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12.5px; outline:none; background:var(--bg); margin-bottom:8px; box-sizing:border-box; }
  .multi-opt { display:flex; align-items:center; gap:7px; padding:5px 6px; border-radius:6px; font-size:12.5px; cursor:pointer; }
  .multi-opt:hover { background:var(--bg-card); }
  .multi-opt .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .multi-opt .lbl { flex:1; }
  .multi-opt .chk { color:var(--moss); }

  /* ---------- units & calendar ---------- */
  .unit-cat { border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .unit-cat-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .unit-cat-title { font-family:var(--serif); font-size:15px; font-weight:600; flex:1; }
  .unit-cat-head .modal-check { font-size:12px; margin:0; }
  .unit-list { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .unit-row { display:flex; align-items:center; gap:8px; }
  .unit-primary { flex:none; display:flex; background:none; border:none; padding:4px; color:var(--border-strong); }
  .unit-primary.on { color:var(--accent); }
  .unit-primary:hover { color:var(--accent); }
  .unit-name { flex:1.4; border:1px solid var(--border); border-radius:6px; }
  .unit-symbol { width:56px; flex:none; border:1px solid var(--border); border-radius:6px; text-align:center; }
  .unit-ratio { width:100px; flex:none; border:1px solid var(--border); border-radius:6px; }
  .unit-ratio-hint { font-size:11px; color:var(--ink-faint); flex:none; width:96px; }
  .unit-row .row-del { margin-left:0; opacity:.5; }
  .unit-row:hover .row-del { opacity:1; }
  .unit-cat-del { flex:none; }
  .cal-months { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .cal-month-row { display:flex; align-items:center; gap:8px; }
  .cal-month-name { flex:1; border:1px solid var(--border); border-radius:6px; }
  .cal-month-days { width:80px; flex:none; border:1px solid var(--border); border-radius:6px; }
  .cal-today-card { background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .cal-today-card .k { font-size:11px; color:var(--ink-faint); letter-spacing:0.04em; margin-bottom:4px; }
  .cal-today-card .v { font-family:var(--serif); font-size:19px; font-weight:600; color:var(--accent); }
  .cal-test-row { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px; }
  .cal-test-row input[type=date] { border:1px solid var(--border); border-radius:6px; padding:6px 9px; background:var(--bg); }
  .cal-test-result { color:var(--ink-soft); }
  .cal-epoch-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; font-size:13px; color:var(--ink-soft); }
  .cal-epoch-row input { border:1px solid var(--border); border-radius:6px; padding:6px 9px; background:var(--bg); }
  .cal-epoch-row input[type=number] { width:70px; }

  /* ---------- sports ---------- */
  .sport-tabs { display:flex; gap:4px; padding:0 22px; border-bottom:1px solid var(--border); }
  .sport-tab { padding:12px 14px; font-size:13.5px; color:var(--ink-faint); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .sport-tab:hover { color:var(--ink); }
  .sport-tab.on { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .sport-standings-th { position:relative; }
  .sport-team-name { display:flex; align-items:center; gap:8px; }
  .sport-team-dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .team-picker-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .team-pick { border:1px solid var(--border-strong); background:var(--bg-card); border-radius:20px; padding:6px 13px; font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:7px; }
  .team-pick.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:600; }
  .field-wrap { display:flex; justify-content:center; margin-bottom:18px; }
  .field-svg-shell { background:#3F6B34; border-radius:10px; padding:10px; box-shadow:0 6px 18px var(--shadow); }
  .field-marker { cursor:pointer; }
  .field-marker circle { fill:var(--bg-card-hover); stroke:#fff; stroke-width:2; }

function hashStr(s) {
  var h = 2166136261;
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function colorForFaction(label) { return FACTION_PALETTE[hashStr(label||"") % FACTION_PALETTE.length]; }
function factionOf(g, node) {
  if (node.type === "faction") return node;
  var found = null;
  g.edges.some(function(ed){
    if (ed.kind !== "affil") return false;
    var otherId = ed.from===node.id ? ed.to : (ed.to===node.id ? ed.from : null);
    if (!otherId) return false;
    var other = g.nodes.find(function(n){ return n.id===otherId; });
    if (other && other.type === "faction") { found = other; return true; }
    return false;
  });
  return found;
}

function randPick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function genPersonReal(culture) {
  var d = NAME_DATA.personReal[culture];
  if (culture === "한국") return randPick(d.surnames)+randPick(d.given1)+randPick(d.given2);
  if (culture === "서양") return randPick(d.first)+" "+randPick(d.last);
  if (culture === "일본") return randPick(d.surnames)+" "+randPick(d.given);
  return randPick(d.surnames)+randPick(d.given);
}
function genPersonOld(culture) {
  if (culture === "한국") return randPick(NAME_DATA.personOld["한국"].given);
  return randPick(NAME_DATA.personOld["서양"].first);
}
function genPersonFantasy() { return randPick(NAME_DATA.personFantasy.pre)+randPick(NAME_DATA.personFantasy.suf); }
function genPlaceFantasy() { return randPick(NAME_DATA.placeFantasy.pre)+randPick(NAME_DATA.placeFantasy.suf); }
function cultureOptionsFor(kind, style) {
  if (kind !== "person") return null;
  if (style === "real") return ["한국","서양","일본","중국"];
  if (style === "old") return ["한국","서양"];
  return null;
}
function genNames(kind, style, culture, count) {
  var out = [];
  var guard = 0;
  while (out.length < count && guard < count*25) {
    guard++;
    var name = null;
    if (kind === "person") {
      if (style === "real") name = genPersonReal(culture);
      else if (style === "old") name = genPersonOld(culture);
      else name = genPersonFantasy();
    } else {
      if (style === "real") name = randPick(NAME_DATA.placeReal);
      else if (style === "old") name = randPick(NAME_DATA.placeOld);
      else name = genPlaceFantasy();
    }
    if (name && out.indexOf(name) === -1) out.push(name);
  }
  return out;
}

    var cultureOpts = cultureOptionsFor(toolState.kind, toolState.style);
    if (cultureOpts && cultureOpts.indexOf(toolState.culture) === -1) toolState.culture = cultureOpts[0];

}

function renderSportsPage(sp) {
  if (!sp.teams) sp.teams = [];
  if (!sp.roster) sp.roster = [];
  if (!sp.records) sp.records = [];
  if (!sp.awards) sp.awards = [];
  var preset = SPORT_PRESETS[sp.sportType] || SPORT_PRESETS.other;
  if (spState.lastId !== sp.id) { spState.tab = "standings"; spState.lineupTeamId = null; spState.recordCat = null; spState.lastId = sp.id; }
  var main = document.getElementById("main");
  var tabs = [["standings","팀 순위"],["lineup","라인업"],["records","기록"],["awards","수상"]];
  var tabsHtml = '<div class="sport-tabs">' + tabs.map(function(t){
    return '<button type="button" class="sport-tab '+(spState.tab===t[0]?"on":"")+'" data-sporttab="'+t[0]+'">'+t[1]+'</button>';
  }).join("") + '</div>';

  var bodyHtml = "";
  if (spState.tab === "standings") bodyHtml = renderStandingsTab(sp, preset);
  else if (spState.tab === "lineup") bodyHtml = renderLineupTab(sp, preset);
  else if (spState.tab === "records") bodyHtml = renderRecordsTab(sp, preset);
  else if (spState.tab === "awards") bodyHtml = renderAwardsTab(sp, preset);

  main.innerHTML =
    '<div class="graph-shell">' +
      '<div class="graph-title-bar"><input class="graph-title" id="sportsTitle" value="'+esc(sp.title)+'" placeholder="기록판 이름"><span class="graph-hint">'+esc(preset.label)+'</span><button class="page-del" id="deleteSportsBtn" style="margin-top:0">'+ic("trash",13)+'<span>기록판 삭제</span></button></div>' +
      tabsHtml +
      '<div class="page-pad" style="padding-top:22px">' + bodyHtml + '</div>' +
    '</div>';

  document.getElementById("sportsTitle").addEventListener("input", function(e){ sp.title = e.target.value; saveData(); renderSidebar(); });
  document.getElementById("deleteSportsBtn").addEventListener("click", function(){ deleteSports(sp.id); });
  main.querySelectorAll("[data-sporttab]").forEach(function(btn){
    btn.addEventListener("click", function(){ spState.tab = btn.dataset.sporttab; renderSportsPage(sp); });
  });

  if (spState.tab === "standings") wireStandingsTab(sp);
  else if (spState.tab === "lineup") wireLineupTab(sp, preset);
  else if (spState.tab === "records") wireRecordsTab(sp);
  else if (spState.tab === "awards") wireAwardsTab(sp);
}
function getUnitCat(work, catKey) {
  if (catKey === "distance") return work.units.distance;
  if (catKey === "currency") return work.units.currency;
  if (catKey.indexOf("extra:") === 0) {
    var id = catKey.slice(6);
    return (work.units.extra||[]).find(function(c){ return c.id===id; });
  }
  return null;
}
function addUnitToCategory(work, catKey) {
  var cat = getUnitCat(work, catKey);
  if (!cat) return;
  var nu = { id: uid(), label:"새 단위", symbol:"", ratio:1 };
  cat.list.push(nu);
  if (!cat.primary) cat.primary = nu.id;
  saveData();
  renderUnitsPage(work);
}
function deleteUnitFromCategory(work, catKey, unitId) {
  var cat = getUnitCat(work, catKey);
  if (!cat) return;
  cat.list = cat.list.filter(function(u){ return u.id!==unitId; });
  if (cat.primary === unitId) cat.primary = cat.list.length ? cat.list[0].id : null;
  saveData();
  renderUnitsPage(work);
}

function starGlyphs(importance) {
  var full = Math.floor(importance);
  var half = (importance - full) >= 0.5;
  var out = "";
  for (var i=0;i<full;i++) out += ic("starFill",9);
  if (half) out += '<span class="star-wrap">'+ic("star",9)+'<span class="star-half-fill">'+ic("starFill",9)+'</span></span>';
  return '<span class="stars-inline">'+out+'</span>';
}

/* ---------------- modal (native confirm/prompt are blocked inside the artifact sandbox, so this replaces them) ---------------- */
function closeModal() { var o = document.getElementById("modalOverlay"); if (o) o.remove(); }
function openModal(opts) {
  closeModal();
  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  var fieldsHtml = (opts.fields || []).map(function(f, i){
    return f.multiline
      ? '<textarea class="modal-input modal-textarea" id="modalField'+i+'" placeholder="'+esc(f.placeholder||"")+'" rows="3">'+esc(f.value||"")+'</textarea>'
      : '<input class="modal-input" type="'+esc(f.type||"text")+'" id="modalField'+i+'" placeholder="'+esc(f.placeholder||"")+'" value="'+esc(f.value||"")+'"'+(f.step?' step="'+esc(f.step)+'"':"")+(f.min!==undefined?' min="'+esc(f.min)+'"':"")+(f.max!==undefined?' max="'+esc(f.max)+'"':"")+'>';
  }).join("");
  var checkHtml = opts.checkbox ? '<label class="modal-check"><input type="checkbox" id="modalCheck" '+(opts.checkboxDefault?"checked":"")+'> '+esc(opts.checkbox)+'</label>' : "";
  var picks = {};
  (opts.pickers || []).forEach(function(p){ picks[p.key] = p.default; });
  var pickersHtml = (opts.pickers || []).map(function(p){
    return '<div class="modal-picker-label">'+esc(p.label)+'</div>' +
      '<div class="modal-picker-row">' + p.options.map(function(o){
        return '<button type="button" class="modal-pick '+(p.noDot?"no-dot ":"")+(o.value===p.default?"on":"")+'" data-pickgroup="'+p.key+'" data-pickval="'+o.value+'" style="--pc:'+(o.color||"var(--ink-faint)")+'">'+esc(o.label)+'</button>';
      }).join("") + '</div>';
  }).join("");
  overlay.innerHTML =
    '<div class="modal-box">' +
      '<div class="modal-title">'+esc(opts.title||"")+'</div>' +
      (opts.message ? '<div class="modal-msg">'+esc(opts.message)+'</div>' : "") +
      fieldsHtml + checkHtml + pickersHtml +
      '<div class="modal-actions"><button class="btn" id="modalCancel">취소</button><button class="btn '+(opts.danger?"danger":"primary")+'" id="modalOk">'+esc(opts.confirmLabel||"확인")+'</button></div>' +
    '</div>';
  document.body.appendChild(overlay);
  var firstInput = overlay.querySelector(".modal-input");
  if (firstInput) { firstInput.focus(); firstInput.select(); }
  overlay.querySelectorAll("[data-pickval]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var group = btn.dataset.pickgroup;
      picks[group] = btn.dataset.pickval;
      overlay.querySelectorAll('[data-pickgroup="'+group+'"]').forEach(function(b){ b.classList.toggle("on", b===btn); });
    });
  });
  function confirmIt() {
    var values = (opts.fields || []).map(function(f, i){ return document.getElementById("modalField"+i).value.trim(); });
    var checked = opts.checkbox ? document.getElementById("modalCheck").checked : undefined;
    closeModal();
    if (opts.onConfirm) opts.onConfirm(values, checked, picks);
  }
  document.getElementById("modalOk").addEventListener("click", confirmIt);
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) closeModal(); });
  overlay.addEventListener("keydown", function(e){
    if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "INPUT" && document.activeElement.classList.contains("modal-input")) { e.preventDefault(); confirmIt(); }
    if (e.key === "Escape") closeModal();
  });
}

/* ---------------- color picker (fixed overlay so it can never get clipped by a scrolling/overflow ancestor) ---------------- */
function closeColorPicker() { var p = document.getElementById("colorPopFixed"); if (p) p.remove(); }
function openColorPicker(target, triggerEl, onChange) {
  closeColorPicker();
  var pop = document.createElement("div");
  pop.className = "color-pop-fixed";
  pop.id = "colorPopFixed";
  function paint() {
    var recentHtml = RECENT_COLORS.length ? (
      '<div class="color-pop-label">최근 사용</div>' +
      '<div class="swatch-grid recent">' + RECENT_COLORS.map(function(hex){
        return '<span class="swatch '+(target.color.toLowerCase()===hex.toLowerCase()?"on":"")+'" style="background:'+hex+'" data-swatch="'+hex+'"></span>';
      }).join("") + '</div>'
    ) : "";
    pop.innerHTML =
      recentHtml +
      '<div class="color-pop-label">기본 팔레트</div>' +
      '<div class="swatch-grid">' + QUICK_COLORS.map(function(hex){
        return '<span class="swatch '+(target.color.toLowerCase()===hex.toLowerCase()?"on":"")+'" style="background:'+hex+'" data-swatch="'+hex+'"></span>';
      }).join("") + '</div>' +
      '<div class="color-hex-row"><input type="text" id="colorHexInput" placeholder="#3B82F6 또는 rgb(59,130,246)"><button type="button" id="colorHexApply">적용</button></div>' +
      '<div class="color-hex-err" id="colorHexErr"></div>' +
      '<div class="color-more"><span>더 많은 색상(전체 팔레트)</span><input type="color" id="colorNative" value="'+target.color+'"></div>';
    pop.querySelectorAll("[data-swatch]").forEach(function(sw){
      sw.addEventListener("click", function(){ applyColor(sw.dataset.swatch); });
    });
    var hexInput = document.getElementById("colorHexInput");
    var hexErr = document.getElementById("colorHexErr");
    function tryApplyHex(){
      var v = hexInput.value.trim();
      if (!v) return;
      var hex = isValidHex(v) ? normalizeHex(v) : parseRgbString(v);
      if (!hex) { hexErr.textContent = "형식을 확인해주세요 (예: #3B82F6 또는 rgb(59,130,246))"; return; }
      applyColor(hex);
    }
    document.getElementById("colorHexApply").addEventListener("click", function(e){ e.stopPropagation(); tryApplyHex(); });
    hexInput.addEventListener("click", function(e){ e.stopPropagation(); });
    hexInput.addEventListener("keydown", function(e){ if (e.key==="Enter") { e.preventDefault(); tryApplyHex(); } });
    document.getElementById("colorNative").addEventListener("input", function(e){ applyColor(e.target.value); });
    document.getElementById("colorNative").addEventListener("click", function(e){ e.stopPropagation(); });
  }
  function applyColor(hex) {
    target.color = hex;
    pushRecentColor(hex);
    saveData();
    closeColorPicker();
    if (onChange) onChange();
  }
  document.body.appendChild(pop);
  paint();
  var rect = triggerEl.getBoundingClientRect();
  var top = Math.min(rect.bottom + 6, window.innerHeight - 340);
  var left = Math.min(rect.left, window.innerWidth - 280);
  pop.style.top = Math.max(8, top) + "px";
  pop.style.left = Math.max(8, left) + "px";
  pop.addEventListener("mousedown", function(e){ e.stopPropagation(); });
  setTimeout(function(){
    document.addEventListener("mousedown", function closeIt(e){
      if (!pop.contains(e.target)) {
        pop.remove();
        document.removeEventListener("mousedown", closeIt);
      }
    });
  }, 0);
}

/* ---------------- find & replace (fixed overlay, works on a plain <textarea>) ---------------- */
function closeFindReplace() { var p = document.getElementById("findReplacePop"); if (p) p.remove(); }
function escRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function openFindReplace(textareaId, triggerEl, onUpdate) {
  closeFindReplace();
  var ta = document.getElementById(textareaId);
  if (!ta) return;
  var pop = document.createElement("div");
  pop.className = "findreplace-pop";
  pop.id = "findReplacePop";
  pop.innerHTML =
    '<div class="fr-row"><input type="text" id="frFind" placeholder="찾을 내용" autocomplete="off"></div>' +
    '<div class="fr-row"><input type="text" id="frReplace" placeholder="바꿀 내용" autocomplete="off"></div>' +
    '<div class="fr-status" id="frStatus"></div>' +
    '<div class="fr-actions">' +
      '<button type="button" id="frNext">다음 찾기</button>' +
      '<button type="button" id="frReplaceOne">바꾸기</button>' +
      '<button type="button" id="frReplaceAll">모두 바꾸기</button>' +
      '<button type="button" id="frClose" title="닫기">'+ic("close",12)+'</button>' +
    '</div>';
  document.body.appendChild(pop);
  var rect = triggerEl.getBoundingClientRect();
  var top = Math.min(rect.bottom + 6, window.innerHeight - 220);
  var left = Math.min(rect.left, window.innerWidth - 284);
  pop.style.top = Math.max(8, top) + "px";
  pop.style.left = Math.max(8, left) + "px";
  pop.addEventListener("mousedown", function(e){ e.stopPropagation(); });

  var findInput = document.getElementById("frFind");
  var statusEl = document.getElementById("frStatus");
  var lastIndex = -1;

  function countMatches(text, q) {
    if (!q) return 0;
    var m = text.match(new RegExp(escRegExp(q), "gi"));
    return m ? m.length : 0;
  }
  function doFind(fromIndex) {
    var q = findInput.value;
    if (!q) { statusEl.textContent = ""; lastIndex = -1; return -1; }
    var text = ta.value;
    var idx = text.toLowerCase().indexOf(q.toLowerCase(), fromIndex);
    if (idx === -1 && fromIndex > 0) idx = text.toLowerCase().indexOf(q.toLowerCase(), 0);
    var total = countMatches(text, q);
    if (idx === -1) { statusEl.textContent = "일치하는 항목이 없어요"; lastIndex = -1; return -1; }
    ta.focus();
    ta.setSelectionRange(idx, idx + q.length);
    lastIndex = idx;
    statusEl.textContent = total + "개 일치";
    return idx;
  }
  document.getElementById("frNext").addEventListener("click", function(){ doFind(lastIndex>=0 ? lastIndex+1 : 0); });
  document.getElementById("frReplaceOne").addEventListener("click", function(){
    var q = findInput.value, rep = document.getElementById("frReplace").value;
    if (!q) return;
    var selected = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    if (ta.selectionStart !== ta.selectionEnd && selected.toLowerCase() === q.toLowerCase()) {
      var pos = ta.selectionStart;
      ta.setRangeText(rep, ta.selectionStart, ta.selectionEnd, "end");
      onUpdate(ta.value);
      doFind(pos + rep.length);
    } else {
      doFind(lastIndex>=0 ? lastIndex+1 : 0);
    }
  });
  document.getElementById("frReplaceAll").addEventListener("click", function(){
    var q = findInput.value, rep = document.getElementById("frReplace").value;
    if (!q) return;
    var text = ta.value;
    var re = new RegExp(escRegExp(q), "gi");
    var count = (text.match(re)||[]).length;
    if (!count) { statusEl.textContent = "일치하는 항목이 없어요"; return; }
    ta.value = text.replace(re, rep);
    onUpdate(ta.value);
    statusEl.textContent = count + "개 바꿈";
    lastIndex = -1;
  });
  document.getElementById("frClose").addEventListener("click", closeFindReplace);
  findInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); doFind(lastIndex>=0 ? lastIndex+1 : 0); }
    if (e.key === "Escape") closeFindReplace();
  });
  findInput.focus();
  setTimeout(function(){
    document.addEventListener("mousedown", function closeIt(e){
      if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener("mousedown", closeIt); }
    });
  }, 0);
}

function createMingChinaMapTemplate(workId) {
  var mp = newMap(workId, { title:"명나라 강호 지도", mapType:"world", era:"early", yearLabel:"명(明) 시대" });
  mp.scaleKmPerUnit = 3.8619569528075983;
  var regionByProvince = {};
  Object.keys(MING_PROVINCE_SHAPES).forEach(function(name){
    var region = { id: uid(), points: MING_PROVINCE_SHAPES[name].map(function(p){ return [p[0], p[1]]; }), terrain: MING_PROVINCE_TERRAIN[name] || "plain", label: name, childMapId: null, houseId: null, countryInfo: null };
    mp.regions.push(region);
    regionByProvince[name] = region;
  });
  var provinceSectCount = {};
  MING_SECTS.forEach(function(s){
    var houseDoc = { id: uid(), workId: workId, title: s.name, summary: "", tags: [], aliases: [], category: "세력", color: "#9C8268", importance: 0, props: [], blocks: [], houseType: s.houseType, parentHouseId: null };
    DOCS.push(houseDoc);
    var region = s.province ? regionByProvince[s.province] : null;
    if (region) {
      var idx = provinceSectCount[s.province] || 0;
      provinceSectCount[s.province] = idx + 1;
      if (idx === 0) region.houseId = houseDoc.id;
      var sc = polygonCentroid(region.points);
      var ang = idx * 2.4;
      var ox = idx === 0 ? 0 : Math.round(Math.cos(ang) * 26);
      var oy = idx === 0 ? -16 : Math.round(-16 + Math.sin(ang) * 26);
      mp.markers.push({ id: uid(), x: sc[0]+ox, y: sc[1]+oy, kind: s.symbol || "other", label: s.markerLabel || s.name });
    }
  });
  var beijing = regionByProvince["북직예(北直隸)"];
  var nanjing = regionByProvince["남직예(南直隸)"];
  if (beijing) { var bc = polygonCentroid(beijing.points); mp.markers.push({ id: uid(), x: bc[0], y: bc[1]+16, kind:"capital", label:"북경" }); }
  if (nanjing) { var nc = polygonCentroid(nanjing.points); mp.markers.push({ id: uid(), x: nc[0], y: nc[1]+16, kind:"capital", label:"응천부(남경)" }); }
  MING_LANDMARKS.forEach(function(lm){
    var region = regionByProvince[lm.province];
    if (!region) return;
    var idx = provinceSectCount[lm.province] || 0;
    provinceSectCount[lm.province] = idx + 1;
    var sc = polygonCentroid(region.points);
    var ang = idx * 2.4;
    var ox = idx === 0 ? 0 : Math.round(Math.cos(ang) * 26);
    var oy = idx === 0 ? -16 : Math.round(-16 + Math.sin(ang) * 26);
    mp.markers.push({ id: uid(), x: sc[0]+ox, y: sc[1]+oy, kind: lm.symbol, label: lm.name });
  });
  MING_RIVERS.forEach(function(rd){
    var pts = rd.provinces.map(function(pname){
      var r = regionByProvince[pname];
      return r ? polygonCentroid(r.points) : null;
    }).filter(Boolean);
    if (pts.length >= 2) mp.lines.push({ id: uid(), points: pts, kind:"river", label: rd.name });
  });
  saveData();
  fitMap(mp);
  saveData();
  render();
  return mp;
}

/* Metro cities (특별시/광역시) are legitimately "city" -- that's what they are.
 * The 9 provinces (도) are administrative regions, not single-biome landscapes, so
 * they don't get a specific terrain claim like "mountain" or "forest" (a province
 * isn't literally a mountain any more than 전라남도 is literally a forest) -- "none"
 * just shows the province name with no misleading prefix. A real, specific landmark
 * (e.g. 설악산 in 강원도) can still be added as its own marker/region if wanted. */

};
function createKoreaMapTemplate(workId) {
  var mp = newMap(workId, { title:"현대 한국 지도", mapType:"world", era:"modern", yearLabel:"현재" });
  mp.scaleKmPerUnit = 1.3542642165509138;
  Object.keys(KOREA_PROVINCE_SHAPES).forEach(function(name){
    mp.regions.push({ id: uid(), points: KOREA_PROVINCE_SHAPES[name].map(function(p){ return [p[0], p[1]]; }), terrain: KOREA_PROVINCE_TERRAIN[name] || "plain", label: name, childMapId: null, houseId: null, countryInfo: null });
  });
  var seoul = mp.regions.find(function(r){ return r.label === "서울특별시"; });
  if (seoul) { var sc = polygonCentroid(seoul.points); mp.markers.push({ id: uid(), x: sc[0], y: sc[1], kind:"capital", label:"서울" }); }
  saveData();
  fitMap(mp);
  saveData();
  render();
  return mp;
}

function sortedEpsOf(novelId, excludeId) {

function insertManuscriptAfter(novelId, afterId) {
  var n = NOVELS.find(function(x){ return x.id === novelId; });
  var sortMode = (n && n.epSort === "newest") ? "newest" : "oldest";
  var eps = sortedEpsOf(novelId);
  var idx = eps.findIndex(function(x){ return x.id === afterId; });
  if (idx === -1) return;
  var after = eps[idx], next = eps[idx+1];
  var newCreatedAt;
  if (next) {
    newCreatedAt = ((after.createdAt||0) + (next.createdAt||0)) / 2;
  } else {
    newCreatedAt = sortMode === "newest" ? (after.createdAt||Date.now()) - 1 : Date.now();
  }
  var m = createManuscript(novelId, newCreatedAt);
  openNewManuscript(m, novelId);

function moveManuscriptTo(draggedId, targetId, before) {
  var dragged = MANUSCRIPTS.find(function(x){ return x.id === draggedId; });
  var target = MANUSCRIPTS.find(function(x){ return x.id === targetId; });
  if (!dragged || !target || dragged.novelId !== target.novelId || draggedId === targetId) return;
  var novelId = dragged.novelId;
  var n = NOVELS.find(function(x){ return x.id === novelId; });
  var sortMode = (n && n.epSort === "newest") ? "newest" : "oldest";
  var eps = sortedEpsOf(novelId, draggedId);
  var idx = eps.findIndex(function(x){ return x.id === targetId; });
  if (idx === -1) return;
  var nb = before ? eps[idx-1] : eps[idx];
  var na = before ? eps[idx] : eps[idx+1];
  var newCreatedAt;
  if (nb && na) newCreatedAt = ((nb.createdAt||0) + (na.createdAt||0)) / 2;
  else if (!nb && na) newCreatedAt = sortMode === "newest" ? (na.createdAt||Date.now()) + 1 : (na.createdAt||Date.now()) - 1;
  else if (nb && !na) newCreatedAt = sortMode === "newest" ? (nb.createdAt||Date.now()) - 1 : (nb.createdAt||Date.now()) + 1;
  else newCreatedAt = Date.now();
  dragged.createdAt = newCreatedAt;
  saveData(); renderSidebar();
}
var msDragId = null;
function wireManuscriptDragDrop(el) {
  var rows = el.querySelectorAll('.ms-draggable[draggable="true"]');
  function clearDragOverMarks() {
    el.querySelectorAll(".drag-over-top,.drag-over-bottom").forEach(function(r){ r.classList.remove("drag-over-top","drag-over-bottom"); });
  }
  rows.forEach(function(row){
    row.addEventListener("dragstart", function(e){
      msDragId = row.dataset.openms;
      row.classList.add("dragging");
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", row.dataset.openms); } catch (err) {}
      }
    });
    row.addEventListener("dragend", function(){
      row.classList.remove("dragging");
      clearDragOverMarks();
      msDragId = null;
    });
    row.addEventListener("dragover", function(e){
      if (!msDragId || msDragId === row.dataset.openms) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height/2;
      row.classList.toggle("drag-over-top", before);
      row.classList.toggle("drag-over-bottom", !before);
    });
    row.addEventListener("dragleave", function(){
      row.classList.remove("drag-over-top","drag-over-bottom");
    });
    row.addEventListener("drop", function(e){
      e.preventDefault();
      var draggedId = msDragId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
      var targetId = row.dataset.openms;
      var before = row.classList.contains("drag-over-top");
      clearDragOverMarks();
      if (!draggedId || draggedId === targetId) return;
      moveManuscriptTo(draggedId, targetId, before);
    });
  });
}

  if (!dragged || !target || dragged.essayId !== target.essayId || draggedId === targetId) return;
  var essayId = dragged.essayId;
  var entries = sortedEssayEntriesOf(essayId, draggedId);
  var idx = entries.findIndex(function (x) { return x.id === targetId; });

  var nb = before ? entries[idx - 1] : entries[idx];
  var na = before ? entries[idx] : entries[idx + 1];
  var newCreatedAt;
  if (nb && na) newCreatedAt = ((nb.createdAt || 0) + (na.createdAt || 0)) / 2;
  else if (!nb && na) newCreatedAt = (na.createdAt || Date.now()) - 1;
  else if (nb && !na) newCreatedAt = (nb.createdAt || Date.now()) + 1;

function wireEssayEntryDragDrop(el) {
  var rows = el.querySelectorAll('.essay-draggable[draggable="true"]');
  function clearDragOverMarks() {
    el.querySelectorAll(".drag-over-top,.drag-over-bottom").forEach(function (r) { r.classList.remove("drag-over-top", "drag-over-bottom"); });
  }
  rows.forEach(function (row) {
    row.addEventListener("dragstart", function (e) {

      row.classList.add("dragging");
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", row.dataset.openessayentry); } catch (err) {}
      }
    });
    row.addEventListener("dragend", function () {
      row.classList.remove("dragging");
      clearDragOverMarks();
      essayDragId = null;
    });
    row.addEventListener("dragover", function (e) {
      if (!essayDragId || essayDragId === row.dataset.openessayentry) return;
      e.preventDefault();

      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      row.classList.toggle("drag-over-top", before);
      row.classList.toggle("drag-over-bottom", !before);
    });
    row.addEventListener("dragleave", function () {
      row.classList.remove("drag-over-top", "drag-over-bottom");
    });

      e.preventDefault();
      var draggedId = essayDragId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
      var targetId = row.dataset.openessayentry;
      var before = row.classList.contains("drag-over-top");

function detectCharactersInManuscript(m, workId) {
  if (!m.characterIds) m.characterIds = [];

  var changed = false;
  DOCS.filter(function(d){ return d.workId===workId && d.category==="등장인물"; }).forEach(function(d){
    if (m.characterIds.indexOf(d.id) !== -1) return;

    var names = [d.title].concat(d.aliases||[]).filter(function(n){ return n && n.trim().length >= 2; });
    if (names.some(function(n){ return text.indexOf(n) !== -1; })) { m.characterIds.push(d.id); changed = true; }
  });

}

    html += '</div>';

    html += '<div class="sb-section"><div class="sb-head" style="margin-left:18px"><span class="add" data-newtimeline="'+work.id+'">'+ic("plus",13)+'</span><span class="t" style="flex:1">연표</span></div>';

  html += '</div>';

}

function renderSidebar() {

    var wGraphs = GRAPHS.filter(function(g){ return g.workId===w.id; });
    var wNovelIds = NOVELS.filter(function(n){ return n.workId===w.id; }).map(function(n){ return n.id; });
    return wDocs.some(function(d){ return docMatches(d, q); }) ||
      wGraphs.some(function(g){ return g.title.toLowerCase().includes(q); }) ||
      TABLES.some(function(t){ return t.workId===w.id && t.title.toLowerCase().includes(q); }) ||
      TIMELINES.some(function(tl){ return tl.workId===w.id && tl.title.toLowerCase().includes(q); }) ||

      SCRIPTS.some(function(s){ return s.workId===w.id && scriptMatches(s, q); }) ||
      NOVELS.some(function(n){ return n.workId===w.id && n.title.toLowerCase().includes(q); }) ||

function buildHouseTree(docs) {
  var byParent = {};
  docs.forEach(function(d){
    var pid = (d.parentHouseId && docs.some(function(x){ return x.id===d.parentHouseId; })) ? d.parentHouseId : "";
    (byParent[pid] = byParent[pid] || []).push(d);
  });
  var out = [];
  function walk(pid, depth) {
    (byParent[pid] || []).forEach(function(d){
      out.push({ doc: d, depth: depth });
      walk(d.id, depth + 1);
    });
  }
  walk("", 0);
  return out;
}

      '</div>' +
      '<div class="'+(isHouse?"doccat-tree":"doccat-grid")+'">' + (cardsHtml || '<div class="sb-empty">아직 문서가 없습니다. "새 문서"로 추가해보세요.</div>') + '</div>' +

  });
}

/* ---------------- graph page ---------------- */
var gState = { mode: "idle", connectFrom: null, selected: null, panStart: null, dragNode: null, justDragged: false };

function currentGraph() { return GRAPHS.find(function(g){ return g.id === state.activeId; }); }

function graphViewBox(g) {
  return "translate(" + g.view.x + "," + g.view.y + ") scale(" + g.view.scale + ")";
}

function fitGraph(g) {
  if (!g.nodes.length) { g.view = { x: 0, y: 0, scale: 1 }; return; }
  var xs = g.nodes.map(function(n){ return n.x; }), ys = g.nodes.map(function(n){ return n.y; });
  var minX = Math.min.apply(null, xs) - 80, maxX = Math.max.apply(null, xs) + 80;
  var minY = Math.min.apply(null, ys) - 60, maxY = Math.max.apply(null, ys) + 60;
  var wrap = document.querySelector(".graph-canvas-wrap");
  var vw = wrap ? wrap.clientWidth : 800, vh = wrap ? wrap.clientHeight : 500;
  var scale = Math.min(vw / (maxX - minX), vh / (maxY - minY), 1.4);
  g.view.scale = scale;
  g.view.x = vw/2 - ((minX+maxX)/2) * scale;
  g.view.y = vh/2 - ((minY+maxY)/2) * scale;
}

function nodeWidth(label) { return Math.max(64, Math.min(200, label.length * 7.5 + 26)); }

function renderGraphPage(g) {
  gState = { mode: "idle", connectFrom: null, selected: gState.selected, panStart: null, dragNode: null, justDragged: false };
  var main = document.getElementById("main");
  var markerDefs = Object.keys(EDGE_KINDS).map(function(k){
    return '<marker id="arrow-'+k+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+EDGE_KINDS[k].color+'"/></marker>';
  }).join("");
  main.innerHTML =
    '<div class="graph-shell">' +
      '<div class="graph-title-bar"><input class="graph-title" id="graphTitle" value="'+esc(g.title)+'" placeholder="관계도 이름"><span class="graph-hint">노드를 드래그해서 옮기고, 배경을 드래그하면 화면이 움직여요</span><button class="page-del" id="deleteGraphBtn" style="margin-top:0">'+ic("trash",13)+'<span>관계도 삭제</span></button></div>' +
      '<div class="graph-canvas-wrap" id="graphWrap">' +
        '<svg class="graph-svg" id="graphSvg"><defs>'+markerDefs+'</defs><g id="graphG"></g></svg>' +
        (g.nodes.length ? "" : '<div class="graph-empty-hint">아직 노드가 없습니다<br>아래 &ldquo;+ 노드&rdquo; 버튼으로 시작하세요</div>') +
        '<div class="graph-toolbar">' +
          '<button class="tb-btn" id="tbAddNode">'+ic("plus",14)+'<span>노드</span></button>' +
          '<div class="tb-sep"></div>' +
          '<button class="tb-btn" id="tbConnect">'+ic("connect",14)+'<span>연결</span></button>' +
          '<div class="tb-sep"></div>' +
          '<button class="tb-btn" id="tbZoomIn">'+ic("zoomin",14)+'</button>' +
          '<button class="tb-btn" id="tbZoomOut">'+ic("zoomout",14)+'</button>' +
          '<button class="tb-btn" id="tbFit">'+ic("fit",14)+'</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById("graphTitle").addEventListener("input", function(e){ g.title = e.target.value; saveData(); renderSidebar(); });
  document.getElementById("deleteGraphBtn").addEventListener("click", function(){ deleteGraph(g.id); });

  if (!g.nodes.length && g.view.scale === 1 && g.view.x === 0 && g.view.y === 0) {
    var wrap = document.getElementById("graphWrap");
    g.view.x = wrap.clientWidth/2; g.view.y = wrap.clientHeight/2;
  }

  drawGraph(g);

  document.getElementById("tbAddNode").addEventListener("click", function(){
    openModal({
      title: "새 노드",
      fields: [{ placeholder: "노드 이름 (문서 제목과 같으면 자동으로 연결됩니다)" }],
      pickers: [{ key:"type", label:"노드 종류", default:"character", options: Object.keys(NODE_TYPES).map(function(k){ return { value:k, label:NODE_TYPES[k].label, color:NODE_TYPES[k].color }; }) }],
      confirmLabel: "추가",
      onConfirm: function(values, checked, picks){
        var label = values[0];
        if (!label) return;
        var wrap = document.getElementById("graphWrap");
        var cx = (wrap.clientWidth/2 - g.view.x) / g.view.scale;
        var cy = (wrap.clientHeight/2 - g.view.y) / g.view.scale;
        var match = DOCS.find(function(d){ return d.title && d.title.toLowerCase() === label.toLowerCase(); });
        g.nodes.push({ id: uid(), label: label, type: picks.type||"character", x: cx + (Math.random()*60-30), y: cy + (Math.random()*60-30), docId: match ? match.id : null });
        saveData(); drawGraph(g);
      }
    });
  });
  document.getElementById("tbConnect").addEventListener("click", function(e){
    gState.mode = gState.mode === "connect" ? "idle" : "connect";
    gState.connectFrom = null;
    gState.justDragged = false;
    e.currentTarget.classList.toggle("active", gState.mode === "connect");
    document.getElementById("graphWrap").classList.toggle("connecting", gState.mode === "connect");
  });
  document.getElementById("tbZoomIn").addEventListener("click", function(){ zoomGraph(g, 1.2); });
  document.getElementById("tbZoomOut").addEventListener("click", function(){ zoomGraph(g, 1/1.2); });
  document.getElementById("tbFit").addEventListener("click", function(){ fitGraph(g); saveData(); drawGraph(g); });

  var wrapEl = document.getElementById("graphWrap");
  wrapEl.addEventListener("wheel", function(e){
    e.preventDefault();
    var rect = wrapEl.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var factor = e.deltaY < 0 ? 1.1 : 1/1.1;
    zoomGraphAt(g, factor, mx, my);
  }, { passive: false });

  wrapEl.addEventListener("mousedown", function(e){
    if (e.target.closest(".gnode") || e.target.closest(".gedge") || e.target.closest(".graph-toolbar")) return;
    gState.panStart = { x: e.clientX, y: e.clientY, vx: g.view.x, vy: g.view.y };
    wrapEl.classList.add("panning");
    gState.selected = null;
    drawGraph(g);
  });
  window.addEventListener("mousemove", function(e){
    if (gState.panStart) {
      g.view.x = gState.panStart.vx + (e.clientX - gState.panStart.x);
      g.view.y = gState.panStart.vy + (e.clientY - gState.panStart.y);
      applyGraphTransform(g);
    } else if (gState.dragNode) {
      var dn = gState.dragNode;
      var dx = (e.clientX - dn.startMouseX) / g.view.scale;
      var dy = (e.clientY - dn.startMouseY) / g.view.scale;
      dn.node.x = dn.startX + dx; dn.node.y = dn.startY + dy;
      dn.moved = true;
      updateNodePosition(g, dn.node);
    }
  });
  window.addEventListener("mouseup", function(){
    if (gState.panStart) { gState.panStart = null; wrapEl.classList.remove("panning"); saveData(); }
    if (gState.dragNode) { gState.justDragged = gState.dragNode.moved; saveData(); gState.dragNode = null; }
  });

  window.onkeydown = function(e) {
    if ((e.key === "Delete" || e.key === "Backspace") && gState.selected && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
      if (gState.selected.type === "node") {
        g.nodes = g.nodes.filter(function(n){ return n.id !== gState.selected.id; });
        g.edges = g.edges.filter(function(ed){ return ed.from !== gState.selected.id && ed.to !== gState.selected.id; });
      } else {

}

function zoomGraphAt(g, factor, mx, my) {

  var wy = (my - g.view.y) / g.view.scale;

function drawGraph(g) {
  var gEl = document.getElementById("graphG");
  gEl.setAttribute("transform", graphViewBox(g));

  var html = "";
  g.edges.forEach(function(ed){
    var a = g.nodes.find(function(n){ return n.id === ed.from; });
    var b = g.nodes.find(function(n){ return n.id === ed.to; });

    var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;

    var memoOffsetX = hasLbl ? w/2 + 13 : 0;

      '<line class="gedge-line" data-edge-line="'+ed.id+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="stroke:'+kind.color+'"'+markerAttrs+'/>' +
      (ed.memo ? '<title>'+esc(ed.memo)+'</title>' : '') +
      (hasLbl ? '<g data-edge-lbl="'+ed.id+'" transform="translate('+mx+','+my+')"><rect class="lbl-bg" x="'+(-w/2)+'" y="-9" width="'+w+'" height="18" rx="9" style="stroke:'+kind.color+'"/><text class="lbl-text" text-anchor="middle" dy="4">'+esc(lblText)+'</text></g>' : '') +
      (ed.memo ? '<g class="gedge-memo" data-edge-memo="'+ed.id+'" transform="translate('+(mx+memoOffsetX)+','+my+')"><circle r="8"/><path d="M-3 -2h6M-3 1h4"/></g>' : '') +
      '<g class="gedge-del" data-edge-del="'+ed.id+'" data-deledge="'+ed.id+'" transform="translate('+mx+','+(my-18)+')"><circle r="7"/><line x1="-3" y1="-3" x2="3" y2="3"/><line x1="3" y1="-3" x2="-3" y2="3"/></g>' +
    '</g>';
  });
  g.nodes.forEach(function(n){
    var w = nodeWidth(n.label);

    var dotColor = faction ? colorForFaction(faction.label) : nt.color;
    html += '<g class="gnode '+(n.docId?"linked":"")+' '+(gState.selected&&gState.selected.type==="node"&&gState.selected.id===n.id?"selected":"")+'" data-node="'+n.id+'" transform="translate('+n.x+','+n.y+')">' +
      '<rect class="gnode-box" x="'+(-w/2)+'" y="-17" width="'+w+'" height="34" rx="8" style="stroke:'+nt.color+'"/>' +
      '<circle class="gnode-dot" cx="'+(-w/2+10)+'" cy="-9" r="3.5" style="fill:'+dotColor+'"/>' +
      '<title>'+esc(nt.label)+': '+esc(n.label)+(faction && faction!==n ? ' ('+esc(faction.label)+' 소속)' : '')+'</title>' +
      '<text text-anchor="middle" dy="4">'+esc(n.label)+'</text>' +
      '<g class="gnode-del" data-delnode="'+n.id+'" transform="translate('+(w/2)+',-17)"><circle r="7"/><line x1="-3" y1="-3" x2="3" y2="3"/><line x1="3" y1="-3" x2="-3" y2="3"/></g>' +
    '</g>';
  });
  gEl.innerHTML = html;

  gEl.querySelectorAll(".gnode").forEach(function(nEl){
    var id = nEl.dataset.node;
    var node = g.nodes.find(function(n){ return n.id===id; });
    nEl.addEventListener("mousedown", function(e){
      if (e.target.closest(".gnode-del")) return;
      e.stopPropagation();
      if (gState.mode === "connect") return;
      gState.dragNode = { node: node, startX: node.x, startY: node.y, startMouseX: e.clientX, startMouseY: e.clientY, moved: false };
    });
    nEl.addEventListener("click", function(e){
      e.stopPropagation();
      if (e.target.closest(".gnode-del")) return;
      if (gState.justDragged) { gState.justDragged = false; return; }
      if (gState.mode === "connect") {
        if (!gState.connectFrom) { gState.connectFrom = node.id; nEl.classList.add("selected"); }
        else if (gState.connectFrom !== node.id) {
          var fromId = gState.connectFrom;
          var newEd = { id: uid(), from: fromId, to: node.id, label: "", memo: "", kind: "basic", direction: "forward", style: "solid", affinity: null, romanceStage: null };
          openEdgeModal(g, newEd, true, function(finalEd){
            g.edges.push(finalEd);

            var tb = document.getElementById("tbConnect"); if (tb) tb.classList.remove("active");
            var wr = document.getElementById("graphWrap"); if (wr) wr.classList.remove("connecting");
            saveData(); drawGraph(g);

      if (node.docId) { state.mode="doc"; state.activeId=node.docId; render(); return; }
      gState.selected = { type:"node", id: node.id };
      drawGraph(g);
    });
    nEl.addEventListener("dblclick", function(e){
      e.stopPropagation();
      if (e.target.closest(".gnode-del")) return;
      openModal({
        title: "노드 편집",

        pickers: [{ key:"type", label:"노드 종류", default: node.type || "other", options: Object.keys(NODE_TYPES).map(function(k){ return { value:k, label:NODE_TYPES[k].label, color:NODE_TYPES[k].color }; }) }],
        confirmLabel: "저장",
        onConfirm: function(values, checked, picks){
          var nv = values[0];
          if (!nv) return;
          node.label = nv;
          node.type = picks.type;
          var match = DOCS.find(function(d){ return d.title && d.title.toLowerCase() === nv.toLowerCase(); });
          node.docId = match ? match.id : node.docId;
          saveData(); drawGraph(g);
        }
      });
    });
    nEl.querySelectorAll(".gnode-del").forEach(function(delEl){
      delEl.addEventListener("click", function(e){
        e.stopPropagation();
        g.nodes = g.nodes.filter(function(x){ return x.id !== node.id; });
        g.edges = g.edges.filter(function(ed){ return ed.from !== node.id && ed.to !== node.id; });
        if (gState.selected && gState.selected.type==="node" && gState.selected.id===node.id) gState.selected = null;
        saveData(); drawGraph(g);
      });
    });
  });
  gEl.querySelectorAll(".gedge").forEach(function(eEl){
    var id = eEl.dataset.edge;
    var ed = g.edges.find(function(ed){ return ed.id === id; });
    if (!ed) return;
    eEl.addEventListener("click", function(e){
      if (e.target.closest(".gedge-del")) return;
      e.stopPropagation();
      openEdgeModal(g, ed, false, function(){ saveData(); drawGraph(g); });
    });
    eEl.querySelectorAll(".gedge-del").forEach(function(delEl){
      delEl.addEventListener("click", function(e){
        e.stopPropagation();
        g.edges = g.edges.filter(function(x){ return x.id !== ed.id; });
        if (gState.selected && gState.selected.type==="edge" && gState.selected.id===ed.id) gState.selected = null;
        saveData(); drawGraph(g);
      });
    });
  });
}

function fitMap(mp) {
  var wrap = document.getElementById("mapWrap");
  var vw = wrap ? wrap.clientWidth : 800, vh = wrap ? wrap.clientHeight : 500;
  if (mp.bgWidth && mp.bgHeight) {
    var scale = Math.min(vw / mp.bgWidth, vh / mp.bgHeight, 2);
    mp.view.scale = scale;
    mp.view.x = (vw - mp.bgWidth*scale)/2;
    mp.view.y = (vh - mp.bgHeight*scale)/2;
    return;
  }
  var xs = [], ys = [];
  (mp.regions||[]).forEach(function(r){ r.points.forEach(function(p){ xs.push(p[0]); ys.push(p[1]); }); });
  (mp.lines||[]).forEach(function(l){ l.points.forEach(function(p){ xs.push(p[0]); ys.push(p[1]); }); });
  (mp.markers||[]).forEach(function(mk){ xs.push(mk.x); ys.push(mk.y); });
  if (!xs.length) { mp.view = { x: vw/2, y: vh/2, scale: 1 }; return; }
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var w = Math.max(1, maxX-minX), h = Math.max(1, maxY-minY);
  var cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  var scale2 = Math.max(0.15, Math.min(4, Math.min(vw/w, vh/h) * 0.85));

function traceMapImage(dataUrl, threshold, callback) {
  var img = new Image();
  img.onload = function(){
    var w = img.naturalWidth, h = img.naturalHeight;
    var maxDim = 1400;
    if (Math.max(w,h) > maxDim) { var s = maxDim/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
    var canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    var src = ctx.getImageData(0,0,w,h).data;
    var gray = new Float32Array(w*h);
    for (var i=0, p=0; i<w*h; i++, p+=4) { gray[i] = 0.299*src[p] + 0.587*src[p+1] + 0.114*src[p+2]; }
    var out = ctx.createImageData(w,h);
    var gxK = [-1,0,1,-2,0,2,-1,0,1], gyK = [-1,-2,-1,0,0,0,1,2,1];
    for (var y=1;y<h-1;y++){
      for (var x=1;x<w-1;x++){
        var gx=0, gy=0, k=0;
        for (var ky=-1;ky<=1;ky++){
          for (var kx=-1;kx<=1;kx++){ var v = gray[(y+ky)*w + (x+kx)]; gx += v*gxK[k]; gy += v*gyK[k]; k++; }
        }
        var mag = Math.sqrt(gx*gx+gy*gy);
        var op = (y*w+x)*4;
        out.data[op] = 30; out.data[op+1] = 26; out.data[op+2] = 20;
        out.data[op+3] = mag > threshold ? 220 : 0;
      }
    }
    ctx.putImageData(out, 0, 0);
    callback(canvas.toDataURL(), w, h);
  };
  img.src = dataUrl;
}

function applyMapCrop(mp, x, y, w, h) {
  function cropDataUrl(dataUrl, callback) {
    if (!dataUrl) { callback(null); return; }
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, x, y, w, h, 0, 0, w, h);
      callback(canvas.toDataURL("image/png"));
    };
    img.src = dataUrl;
  }
  cropDataUrl(mp.bgImage, function(newBg){
    mp.bgImage = newBg;
    mp.bgWidth = w; mp.bgHeight = h;
    mp.traceImage = null;
    mp.bgMode = newBg ? "original" : "hidden";
    mp.regions.forEach(function(r){ r.points = r.points.map(function(p){ return [p[0]-x, p[1]-y]; }); });
    mp.lines.forEach(function(l){ l.points = l.points.map(function(p){ return [p[0]-x, p[1]-y]; }); });
    mp.markers.forEach(function(mk){ mk.x -= x; mk.y -= y; });
    fitMap(mp);
    saveData(); drawMap(mp);
    if (newBg) {
      traceMapImage(newBg, 60, function(traceUrl){
        mp.traceImage = traceUrl;
        mp.bgMode = "trace";
        saveData(); drawMap(mp);
      });
    }
  });
}
function applyMapRotation(mp, deg) {
  if (!mp.bgImage || !deg) return;
  var rad = deg * Math.PI / 180;
  var W = mp.bgWidth, H = mp.bgHeight;
  var cos = Math.cos(rad), sin = Math.sin(rad);
  var newW = Math.abs(W*cos) + Math.abs(H*sin);
  var newH = Math.abs(W*sin) + Math.abs(H*cos);
  function rotateDataUrl(dataUrl, callback) {
    if (!dataUrl) { callback(null); return; }
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      canvas.width = newW; canvas.height = newH;
      var ctx = canvas.getContext("2d");
      ctx.translate(newW/2, newH/2);
      ctx.rotate(rad);
      ctx.drawImage(img, -W/2, -H/2, W, H);
      callback(canvas.toDataURL("image/png"));
    };
    img.src = dataUrl;
  }
  function rotatePoint(px, py) {
    var dx = px - W/2, dy = py - H/2;
    var rx = dx*cos - dy*sin, ry = dx*sin + dy*cos;
    return [rx + newW/2, ry + newH/2];
  }
  rotateDataUrl(mp.bgImage, function(newBg){
    mp.bgImage = newBg;
    mp.bgWidth = newW; mp.bgHeight = newH;
    mp.traceImage = null;
    mp.bgMode = newBg ? "original" : "hidden";
    mp.regions.forEach(function(r){ r.points = r.points.map(function(p){ return rotatePoint(p[0], p[1]); }); });
    mp.lines.forEach(function(l){ l.points = l.points.map(function(p){ return rotatePoint(p[0], p[1]); }); });
    mp.markers.forEach(function(mk){ var np = rotatePoint(mk.x, mk.y); mk.x = np[0]; mk.y = np[1]; });
    fitMap(mp);
    saveData(); drawMap(mp);
    if (newBg) {
      traceMapImage(newBg, 60, function(traceUrl){
        mp.traceImage = traceUrl;
        mp.bgMode = "trace";
        saveData(); drawMap(mp);
      });
    }
  });
}

  window.onkeydown = function(e){
