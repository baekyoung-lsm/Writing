      if (mpState.selected.type === "region") mp.regions = mp.regions.filter(function(r){ return r.id !== mpState.selected.id; });
      else if (mpState.selected.type === "line") mp.lines = mp.lines.filter(function(l){ return l.id !== mpState.selected.id; });
      else mp.markers = mp.markers.filter(function(mk){ return mk.id !== mpState.selected.id; });
      mpState.selected = null; saveData(); drawMap(mp);
    }
  };
}

/* ---------------- table / database page ---------------- */
function currentTable() { return TABLES.find(function(t){ return t.id === state.activeId; }); }

function newTableColumn(t) {
  openModal({
    title: "새 열",
    fields: [{ placeholder: "열 이름" }],
    pickers: [{ key:"type", label:"열 종류", default:"text", options: Object.keys(TABLE_COL_TYPES).map(function(k){ return { value:k, label:TABLE_COL_TYPES[k].label, color:"var(--ink-faint)" }; }) }],
    confirmLabel: "추가",
    onConfirm: function(values, checked, picks){
      var name = values[0]; if (!name) return;
      var col = { id: uid(), name: name, type: picks.type };
      if (picks.type === "multi") col.options = [];
      t.columns.push(col);
      saveData(); renderTablePage(t);
    }
  });
}
function deleteTableColumn(t, colId) {
  t.columns = t.columns.filter(function(c){ return c.id !== colId; });
  t.rows.forEach(function(r){ delete r.cells[colId]; });
  saveData(); renderTablePage(t);
}
function newTableRow(t) {
  t.rows.push({ id: uid(), cells: {} });
  saveData(); renderTablePage(t);
}
function deleteTableRow(t, rowId) {
  t.rows = t.rows.filter(function(r){ return r.id !== rowId; });
  saveData(); renderTablePage(t);
}

function cellValueHtml(row, col) {
  var v = row.cells[col.id];
  if (col.type === "check") {
    return '<div class="cell-check-wrap"><input type="checkbox" data-cellcheck="'+row.id+':'+col.id+'" '+(v?"checked":"")+'></div>';
  }
  if (col.type === "multi") {
    var ids = v || [];
    var chips = ids.map(function(oid){
      var opt = (col.options||[]).find(function(o){ return o.id===oid; });
      return opt ? '<span class="cell-tag" style="background:'+opt.color+'">'+esc(opt.label)+'</span>' : '';
    }).join("");
    return '<div class="cell-multi" data-cellmulti="'+row.id+':'+col.id+'">' + (chips || '<span class="cell-multi-empty">+ 추가</span>') + '</div>';
  }
  var inputType = col.type === "number" ? "number" : col.type === "date" ? "date" : "text";
  return '<input class="cell-input" type="'+inputType+'" data-cell="'+row.id+':'+col.id+'" value="'+esc(v==null?"":v)+'">';
}

function openMultiPop(t, rowId, colId, cellEl) {
  document.querySelectorAll(".multi-pop").forEach(function(p){ p.remove(); });
  var row = t.rows.find(function(r){ return r.id===rowId; });
  var col = t.columns.find(function(c){ return c.id===colId; });
  if (!row || !col) return;
  if (!col.options) col.options = [];
  var selected = (row.cells[colId] || []).slice();
  var pop = document.createElement("div");
  pop.className = "multi-pop";
  pop.innerHTML = '<input type="text" placeholder="옵션 검색 또는 새로 만들기" id="multiSearch"><div id="multiOptList"></div>';
  cellEl.style.position = "relative";
  cellEl.appendChild(pop);
  var search = pop.querySelector("#multiSearch");
  function renderList() {
    var q = search.value.trim().toLowerCase();
    var list = pop.querySelector("#multiOptList");
    var matches = col.options.filter(function(o){ return !q || o.label.toLowerCase().includes(q); });
    var exact = col.options.some(function(o){ return o.label.toLowerCase()===q; });
    var html = matches.map(function(o){
      var on = selected.indexOf(o.id) !== -1;
      return '<div class="multi-opt" data-opt="'+o.id+'"><span class="dot" style="background:'+o.color+'"></span><span class="lbl">'+esc(o.label)+'</span>'+(on?'<span class="chk">&#10003;</span>':'')+'</div>';
    }).join("");
    if (q && !exact) {
      html += '<div class="multi-opt" data-newopt="1"><span class="dot" style="background:'+TAG_COLORS[col.options.length % TAG_COLORS.length]+'"></span><span class="lbl">&ldquo;'+esc(search.value.trim())+'&rdquo; 추가</span></div>';
    }
    list.innerHTML = html || '<div class="cell-multi-empty" style="padding:6px 4px">옵션이 없습니다</div>';
    list.querySelectorAll("[data-opt]").forEach(function(optRow){
      optRow.addEventListener("click", function(){
        var oid = optRow.dataset.opt;
        var idx = selected.indexOf(oid);
        if (idx === -1) selected.push(oid); else selected.splice(idx,1);
        row.cells[colId] = selected.slice();
        saveData();
        renderList();
      });
    });
    list.querySelectorAll("[data-newopt]").forEach(function(el2){
      el2.addEventListener("click", function(){
        var label = search.value.trim(); if (!label) return;
        var newOpt = { id: uid(), label: label, color: TAG_COLORS[col.options.length % TAG_COLORS.length] };
        col.options.push(newOpt);
        selected.push(newOpt.id);
        row.cells[colId] = selected.slice();
        saveData();
        search.value = "";
        renderList();
      });
    });
  }
  search.addEventListener("input", renderList);
  search.addEventListener("click", function(e){ e.stopPropagation(); });
  renderList();
  search.focus();
  pop.addEventListener("click", function(e){ e.stopPropagation(); });
  setTimeout(function(){
    document.addEventListener("click", function closeIt(e){
      if (!pop.contains(e.target)) {
        pop.remove();
        document.removeEventListener("click", closeIt);
        renderTablePage(t);
      }
    });
  }, 0);
}

function renderTablePage(t) {
  var main = document.getElementById("main");
  var theadCols = t.columns.map(function(col){
    var typeInfo = TABLE_COL_TYPES[col.type] || TABLE_COL_TYPES.text;
    return '<th data-col="'+col.id+'"><span class="col-icon">'+ic(typeInfo.icon,12)+'</span><span class="col-name" data-editcol="'+col.id+'">'+esc(col.name)+'</span><button class="col-del" data-delcol="'+col.id+'">'+ic("close",11)+'</button></th>';
  }).join("");
  var bodyRows = t.rows.map(function(row){
    var tds = t.columns.map(function(col){ return '<td>'+cellValueHtml(row, col)+'</td>'; }).join("");
    return '<tr data-row="'+row.id+'">'+tds+'<td class="row-del-cell"><button data-delrow="'+row.id+'">'+ic("close",11)+'</button></td></tr>';
  }).join("");

  main.innerHTML =
    '<div class="graph-shell">' +
      '<div class="graph-title-bar"><input class="graph-title" id="tblTitle" value="'+esc(t.title)+'" placeholder="표 이름"><button class="page-del" id="deleteTableBtn" style="margin-top:0">'+ic("trash",13)+'<span>표 삭제</span></button></div>' +
      '<div class="page-pad" style="padding-top:20px">' +
        '<div class="db-scroll"><table class="db-table" id="dbTable"><thead><tr>' + theadCols + '<th class="col-add-th"><button id="addColBtn">'+ic("plus",13)+'</button></th></tr></thead><tbody id="dbTbody">' + bodyRows + '</tbody></table>' +
        '<button class="add-row-btn" id="addRowBtn">'+ic("plus",13)+' 새 행</button></div>' +
      '</div>' +
    '</div>';

  document.getElementById("tblTitle").addEventListener("input", function(e){ t.title = e.target.value; saveData(); renderSidebar(); });
  document.getElementById("deleteTableBtn").addEventListener("click", function(){ deleteTable(t.id); });
  document.getElementById("addColBtn").addEventListener("click", function(){ newTableColumn(t); });
  document.getElementById("addRowBtn").addEventListener("click", function(){ newTableRow(t); });

  main.querySelectorAll("[data-delcol]").forEach(function(btn){
    btn.addEventListener("click", function(e){ e.stopPropagation(); deleteTableColumn(t, btn.dataset.delcol); });
  });
  main.querySelectorAll("[data-delrow]").forEach(function(btn){
    btn.addEventListener("click", function(){ deleteTableRow(t, btn.dataset.delrow); });
  });
  main.querySelectorAll("[data-editcol]").forEach(function(labelEl){
    labelEl.addEventListener("click", function(){
      var colId = labelEl.dataset.editcol;
      var col = t.columns.find(function(c){ return c.id===colId; });
      var input = document.createElement("input");
      input.value = col.name; labelEl.innerHTML = ""; labelEl.appendChild(input); input.focus(); input.select();
      function commit(){ col.name = input.value.trim() || col.name; saveData(); renderTablePage(t); }
      input.addEventListener("keydown", function(e){ if (e.key==="Enter") commit(); });
      input.addEventListener("blur", commit);
      input.addEventListener("click", function(e){ e.stopPropagation(); });
    });
  });
  main.querySelectorAll("[data-cell]").forEach(function(inp){
    inp.addEventListener("input", function(){
      var parts = inp.dataset.cell.split(":");
      var row = t.rows.find(function(r){ return r.id===parts[0]; });
      if (row) { row.cells[parts[1]] = inp.value; saveData(); }
    });
  });
  main.querySelectorAll("[data-cellcheck]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var parts = inp.dataset.cellcheck.split(":");
      var row = t.rows.find(function(r){ return r.id===parts[0]; });
      if (row) { row.cells[parts[1]] = inp.checked; saveData(); }
    });
  });
  main.querySelectorAll("[data-cellmulti]").forEach(function(cell){
    cell.addEventListener("click", function(){
      var parts = cell.dataset.cellmulti.split(":");
      openMultiPop(t, parts[0], parts[1], cell);
    });
  });
}

/* ---------------- timeline / chronology page ---------------- */
function currentTimeline() { return TIMELINES.find(function(tl){ return tl.id === state.activeId; }); }
function newTimelineEvent(tl) {
  var maxOrder = tl.events.reduce(function(mx,e){ return Math.max(mx, e.order||0); }, 0);
  var ev = { id: uid(), order: maxOrder+1, label: "", title: "", description: "", docId: null };
  tl.events.push(ev);
  saveData(); renderTimelinePage(tl);
  var el = document.getElementById("tlLabel-"+ev.id);
  if (el) el.focus();
}
function deleteTimelineEvent(tl, id) {
  tl.events = tl.events.filter(function(e){ return e.id !== id; });
  saveData(); renderTimelinePage(tl);
}
function timelineEventsHtml(tl, workDocsForLink, editable) {
  var sorted = tl.events.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  return sorted.map(function(ev){
    if (!editable) {
      return '<div class="tl-item tl-item-ro">' +
        '<div class="tl-marker"><div class="tl-dot"></div><div class="tl-line"></div></div>' +

          '<div class="tl-ro-label">'+esc(ev.label||"")+'</div>' +
          '<div class="tl-ro-title">'+esc(ev.title||"제목 없는 사건")+'</div>' +
          (ev.description ? '<div class="tl-ro-desc">'+esc(ev.description)+'</div>' : '') +
        '</div>' +
      '</div>';
    }
    var linkedDoc = ev.docId ? workDocsForLink.find(function(d){ return d.id === ev.docId; }) : null;
    var docOptions = '<option value="">문서 연결 안 함</option>' + workDocsForLink.map(function(d){ return '<option value="'+d.id+'" '+(ev.docId===d.id?"selected":"")+'>'+esc(d.title||"제목 없음")+'</option>'; }).join("");
    return '<div class="tl-item">' +
      '<div class="tl-marker"><div class="tl-dot"></div><div class="tl-line"></div></div>' +
      '<div class="tl-content">' +
        '<div class="tl-row-top">' +
          '<input class="tl-order" type="number" id="tlOrder-'+ev.id+'" value="'+(ev.order||0)+'" title="정렬 순서">' +
          '<input class="tl-label" id="tlLabel-'+ev.id+'" placeholder="시점 표기 (예: 정복력 300년)" value="'+esc(ev.label||"")+'">' +
          '<select class="sel tl-doclink" id="tlDoc-'+ev.id+'">'+docOptions+'</select>' +
          (linkedDoc ? '<button type="button" class="tl-doc-open" data-tldocopen="'+linkedDoc.id+'" title="연결된 문서 열기 — '+esc(linkedDoc.title||"제목 없음")+'">'+ic("link",12)+'</button>' : '') +
          '<button class="row-del" data-deltlevent="'+ev.id+'" title="삭제">'+ic("trash",12)+'</button>' +
        '</div>' +
        '<input class="field-input tl-title" id="tlTitle-'+ev.id+'" placeholder="사건 제목" value="'+esc(ev.title||"")+'">' +
        '<textarea class="field-input tl-desc" id="tlDesc-'+ev.id+'" rows="1" placeholder="설명 (선택)">'+esc(ev.description||"")+'</textarea>' +
      '</div>' +
    '</div>';
  }).join("");

function renderTimelinePage(tl) {
  var main = document.getElementById("main");
  var workDocsForLink = DOCS.filter(function(d){ return d.workId === tl.workId; });
  var sorted = tl.events.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  var itemsHtml = timelineEventsHtml(tl, workDocsForLink, true);
  var otherTimelines = TIMELINES.filter(function(t){ return t.workId === tl.workId && t.id !== tl.id; });
  var parallelTl = tl.linkedParallelTimelineId ? TIMELINES.find(function(t){ return t.id === tl.linkedParallelTimelineId; }) : null;
  var parallelRowHtml =
    '<div class="novel-subrow" style="padding:0 22px 12px;flex-wrap:wrap">' +
      '<input class="field-input" id="tlParallelLabel" style="max-width:140px;flex:none" placeholder="이 연표 라벨 (예: 회귀 후)" value="'+esc(tl.parallelLabel||"")+'">' +
      '<select class="sel" id="tlParallelSelect" style="max-width:220px">' +
        '<option value="">평행 연대표 연결 안 함</option>' +
        otherTimelines.map(function(t){ return '<option value="'+t.id+'" '+(tl.linkedParallelTimelineId===t.id?"selected":"")+'>'+esc(t.title||"제목 없는 연표")+'</option>'; }).join("") +
      '</select>' +
      (parallelTl ? '<button type="button" class="ms-sort-btn '+(tl.showParallel?"on":"")+'" id="tlToggleParallel">'+ic("graph",11)+' 나란히 보기</button>' : "") +
    '</div>';

  var parallelViewHtml = "";
  if (parallelTl && tl.showParallel) {
    var parallelDocs = DOCS.filter(function(d){ return d.workId === parallelTl.workId; });
    parallelViewHtml =
      '<div class="tl-parallel-wrap">' +
        '<div class="tl-col">' +
          '<div class="tl-col-head">'+(tl.parallelLabel ? esc(tl.parallelLabel) : esc(tl.title||"이 연표"))+'</div>' +
          '<div class="tl-list">' + (itemsHtml || '<div class="sb-empty">아직 사건이 없습니다.</div>') + '</div>' +
        '</div>' +
        '<div class="tl-col">' +
          '<div class="tl-col-head">'+(parallelTl.parallelLabel ? esc(parallelTl.parallelLabel) : esc(parallelTl.title||"평행 연표"))+' <button type="button" class="tl-doc-open" data-tlopenother="'+parallelTl.id+'" title="이 연표 열기">'+ic("link",12)+'</button></div>' +
          '<div class="tl-list">' + (timelineEventsHtml(parallelTl, parallelDocs, false) || '<div class="sb-empty">아직 사건이 없습니다.</div>') + '</div>' +
        '</div>' +
      '</div>';
  }

  main.innerHTML =
    '<div class="graph-shell">' +
      '<div class="graph-title-bar"><input class="graph-title" id="tlTitleInput" value="'+esc(tl.title)+'" placeholder="연표 이름"><span class="graph-hint">사건을 시간순으로 정리해보세요 — 정렬 순서 숫자로 순서를 바꿀 수 있어요</span><button class="page-del" id="deleteTimelineBtn" style="margin-top:0">'+ic("trash",13)+'<span>연표 삭제</span></button></div>' +
      parallelRowHtml +
      '<div class="page-pad" style="padding-top:20px">' +
        (parallelViewHtml || ('<div class="tl-list" id="tlList">' + (itemsHtml || '<div class="sb-empty">아직 사건이 없습니다. 아래에서 추가해보세요.</div>') + '</div>')) +
        '<button class="add-block" id="addTlEventBtn">'+ic("plus",13)+' 사건 추가</button>' +
      '</div>' +
    '</div>';

  document.getElementById("tlTitleInput").addEventListener("input", function(e){ tl.title = e.target.value; saveData(); renderSidebar(); });

  document.getElementById("addTlEventBtn").addEventListener("click", function(){ newTimelineEvent(tl); });
  document.getElementById("tlParallelLabel").addEventListener("input", function(e){ tl.parallelLabel = e.target.value; saveData(); });
  document.getElementById("tlParallelSelect").addEventListener("change", function(e){
    tl.linkedParallelTimelineId = e.target.value || null;
    if (!tl.linkedParallelTimelineId) tl.showParallel = false;
    saveData(); renderTimelinePage(tl);
  });
  var toggleParallelBtn = document.getElementById("tlToggleParallel");
  if (toggleParallelBtn) toggleParallelBtn.addEventListener("click", function(){
    tl.showParallel = !tl.showParallel;
    saveData(); renderTimelinePage(tl);
  });
  var openOtherBtn = main.querySelector("[data-tlopenother]");
  if (openOtherBtn) openOtherBtn.addEventListener("click", function(){
    state.mode = "timeline"; state.activeId = openOtherBtn.dataset.tlopenother; render();
  });

  if (!parallelTl || !tl.showParallel) {
    sorted.forEach(function(ev){
      autoGrow(document.getElementById("tlDesc-"+ev.id));
      document.getElementById("tlOrder-"+ev.id).addEventListener("input", function(e){ ev.order = parseFloat(e.target.value) || 0; saveData(); });
      document.getElementById("tlOrder-"+ev.id).addEventListener("blur", function(){ renderTimelinePage(tl); });
      document.getElementById("tlLabel-"+ev.id).addEventListener("input", function(e){ ev.label = e.target.value; saveData(); });
      document.getElementById("tlTitle-"+ev.id).addEventListener("input", function(e){ ev.title = e.target.value; saveData(); });
      document.getElementById("tlDesc-"+ev.id).addEventListener("input", function(e){ ev.description = e.target.value; autoGrow(e.target); saveData(); });
      document.getElementById("tlDoc-"+ev.id).addEventListener("change", function(e){ ev.docId = e.target.value || null; saveData(); renderTimelinePage(tl); });
    });
    main.querySelectorAll("[data-deltlevent]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteTimelineEvent(tl, btn.dataset.deltlevent); });
    });
    main.querySelectorAll("[data-tldocopen]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.mode = "doc"; state.activeId = btn.dataset.tldocopen; state.addPropOpen = false; state.colorPickerOpen = false; render(); });
    });
  } else {
    var leftCol = main.querySelectorAll(".tl-col")[0];
    sorted.forEach(function(ev){
      var descEl = leftCol.querySelector("#tlDesc-"+ev.id);
      if (descEl) autoGrow(descEl);
      var orderEl = leftCol.querySelector("#tlOrder-"+ev.id);
      if (orderEl) { orderEl.addEventListener("input", function(e){ ev.order = parseFloat(e.target.value) || 0; saveData(); }); orderEl.addEventListener("blur", function(){ renderTimelinePage(tl); }); }
      var labelEl = leftCol.querySelector("#tlLabel-"+ev.id);
      if (labelEl) labelEl.addEventListener("input", function(e){ ev.label = e.target.value; saveData(); });
      var titleEl = leftCol.querySelector("#tlTitle-"+ev.id);
      if (titleEl) titleEl.addEventListener("input", function(e){ ev.title = e.target.value; saveData(); });
      if (descEl) descEl.addEventListener("input", function(e){ ev.description = e.target.value; autoGrow(e.target); saveData(); });
      var docSel = leftCol.querySelector("#tlDoc-"+ev.id);
      if (docSel) docSel.addEventListener("change", function(e){ ev.docId = e.target.value || null; saveData(); renderTimelinePage(tl); });
    });
    leftCol.querySelectorAll("[data-deltlevent]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteTimelineEvent(tl, btn.dataset.deltlevent); });
    });
    leftCol.querySelectorAll("[data-tldocopen]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.mode = "doc"; state.activeId = btn.dataset.tldocopen; state.addPropOpen = false; state.colorPickerOpen = false; render(); });
    });
  }
}

/* ---------------- manuscript page (separate from the setting-note docs/graphs) ---------------- */
function currentManuscript() { return MANUSCRIPTS.find(function(m){ return m.id === state.activeId; }); }
function updateMsCharCount(m) {
  var el = document.getElementById("msCharCount");
  if (el) el.textContent = fmtNum(charCount(m.text)) + "자";
}
function novelStats(novelId) {
  var eps = MANUSCRIPTS.filter(function(m){ return m.novelId === novelId; });
  var total = eps.reduce(function(s,m){ return s+charCount(m.text); }, 0);
  var avg = eps.length ? Math.round(total/eps.length) : 0;
  return { count: eps.length, total: total, avg: avg };
}
function updateMsStatsBar(m) {
  var el = document.getElementById("msStatsBar");
  if (!el) return;
  var st = novelStats(m.novelId);
  el.innerHTML =
    '<span>이 화 <b>'+fmtNum(charCount(m.text))+'</b>자</span>' +
    '<span>소설 전체 <b>'+fmtNum(st.total)+'</b>자 ('+st.count+'화)</span>' +
    '<span>화 평균 <b>'+fmtNum(st.avg)+'</b>자</span>';
}
function updateMsGoalBar(m) {
  var wrap = document.getElementById("msGoalBarWrap");
  if (!wrap) return;
  var goal = Number(m.goalChars) || 0;
  if (!goal) { wrap.innerHTML = ""; return; }
  var cur = charCount(m.text);
  var pct = Math.round((cur/goal)*100);
  var barPct = Math.max(0, Math.min(100, pct));
  wrap.innerHTML =
    '<div class="ms-goal-bar-track"><div class="ms-goal-bar-fill'+(pct>=100?" done":"")+'" style="width:'+barPct+'%"></div></div>' +
    '<span class="ms-goal-pct">'+fmtNum(cur)+' / '+fmtNum(goal)+'자 ('+pct+'%)</span>';
}
var msSaveTimer = null;
function flashSaveIndicator() {
  var el = document.getElementById("msSaveIndicator");
  if (!el) return;
  el.textContent = "저장 중…";
  el.classList.remove("saved");
  clearTimeout(msSaveTimer);
  msSaveTimer = setTimeout(function(){
    el.textContent = "저장됨";
    el.classList.add("saved");
  }, 500);
}
function prevManuscriptOf(m) {
  if (!m.novelId) return null;
  var sibs = MANUSCRIPTS.filter(function(x){ return x.novelId === m.novelId; })
    .slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  var idx = sibs.findIndex(function(x){ return x.id === m.id; });
  return idx > 0 ? sibs[idx-1] : null;
}
function tailText(text, n) {
  var t = (text||"").trim();
  if (!t) return "(아직 내용이 없어요)";
  return (t.length > n ? "…" : "") + t.slice(-n);
}

var BOOK_SINGLE_W = 338, BOOK_SINGLE_H = 552;
var BOOK_SPREAD_W = 288, BOOK_SPREAD_H = 552;
function measureBookPages(text, widthPx, heightPx) {
  var paras = (text || "").split(/\n+/).filter(function(p){ return p.length; });
  if (!paras.length) return [""];
  var probe = document.createElement("div");
  probe.style.position = "fixed";
  probe.style.visibility = "hidden";
  probe.style.pointerEvents = "none";
  probe.style.left = "-9999px";
  probe.style.top = "0";
  probe.style.width = widthPx + "px";
  probe.style.boxSizing = "border-box";
  probe.style.fontFamily = "var(--serif)";
  probe.style.fontSize = "15.5px";
  probe.style.lineHeight = "2.05";
  document.body.appendChild(probe);
  function setParas(list) {
    probe.innerHTML = list.map(function(p){ return '<p style="text-indent:1em;text-align:justify;margin:0 0 0.85em 0;">'+esc(p)+'</p>'; }).join("");
  }
  var pages = [], cur = [];
  paras.forEach(function(p){
    cur.push(p);
    setParas(cur);
    if (probe.scrollHeight > heightPx) {
      cur.pop();
      if (cur.length) { pages.push(cur.join("\n")); cur = [p]; }
      else { cur = [p]; }
    }
  });
  if (cur.length) pages.push(cur.join("\n"));
  document.body.removeChild(probe);
  if (!pages.length) pages = [""];
  return pages;
}
function paginateBook(m) {
  return m.bookSpread
    ? measureBookPages(m.text, BOOK_SPREAD_W, BOOK_SPREAD_H)
    : measureBookPages(m.text, BOOK_SINGLE_W, BOOK_SINGLE_H);
}

function editScrollFraction() {
  var el = document.getElementById("bookEditText");
  if (!el) return 0;
  var denom = el.scrollHeight - el.clientHeight;
  return denom > 0 ? Math.max(0, Math.min(1, el.scrollTop / denom)) : 0;
}
function renderBookArea(m) {
  var area = document.getElementById("bookArea");
  if (!area) return;
  var novelForBook = NOVELS.find(function(n){ return n.id === m.novelId; });
  var bookWorkId = novelForBook ? novelForBook.workId : null;
  var modeToggle =
    '<div class="book-mode-toggle">' +
      '<button type="button" id="bookSingleBtn" class="'+(!m.bookSpread?"on":"")+'">한쪽</button>' +
      '<button type="button" id="bookSpreadBtn" class="'+(m.bookSpread?"on":"")+'">두쪽</button>' +
    '</div>';
  if (m.bookMode === "view") {
    var pages = paginateBook(m);
    if (m.bookPage >= pages.length) m.bookPage = pages.length - 1;
    if (m.bookPage < 0) m.bookPage = 0;
    var shellHtml, navHtml;
    if (m.bookSpread) {
      var left = m.bookPage - (m.bookPage % 2);
      var right = left + 1;
      var leftParas = (pages[left] || "").split("\n").filter(function(p){ return p.length; });
      var rightParas = right < pages.length ? pages[right].split("\n").filter(function(p){ return p.length; }) : null;
      shellHtml = '<div class="book-shell spread"><div class="book-spread-inner">' +
        '<div class="book-page-content spread-page left" id="bookPageContentL">' +
          (leftParas.length ? leftParas.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("") : '<p style="text-indent:0;color:var(--ink-faint)">아직 내용이 없습니다.</p>') +
        '</div>' +
        '<div class="book-page-content spread-page right" id="bookPageContentR">' +
          (rightParas === null ? '' : rightParas.length ? rightParas.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("") : '<p style="text-indent:0;color:var(--ink-faint)"></p>') +
        '</div>' +
      '</div></div>';
      var rightLabel = right < pages.length ? (right+1) : "";
      navHtml = '<div class="book-nav">' +
          '<button id="bookPrev" '+(left<=0?"disabled":"")+'>'+ic("chevL",13)+'</button>' +
          '<span>'+(left+1)+(rightLabel?"-"+rightLabel:"")+' / '+pages.length+'</span>' +
          '<button id="bookNext" '+(right>=pages.length-1?"disabled":"")+'>'+ic("chevR",13)+'</button>' +
        '</div>';
    } else {
      var paras = pages[m.bookPage].split("\n").filter(function(p){ return p.length; });
      shellHtml = '<div class="book-shell"><div class="book-page-content" id="bookPageContent">' +
          (paras.length ? paras.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("") : '<p style="text-indent:0;color:var(--ink-faint)">아직 내용이 없습니다.</p>') +
        '</div></div>';
      navHtml = '<div class="book-nav">' +
          '<button id="bookPrev" '+(m.bookPage<=0?"disabled":"")+'>'+ic("chevL",13)+'</button>' +
          '<span>'+(m.bookPage+1)+' / '+pages.length+'</span>' +
          '<button id="bookNext" '+(m.bookPage>=pages.length-1?"disabled":"")+'>'+ic("chevR",13)+'</button>' +
        '</div>';
    }
    area.innerHTML = modeToggle +
      '<div class="book-outer">' + shellHtml + '</div>' +
      navHtml +
      '<div class="book-hint">양장본 조판을 흉내낸 미리보기입니다 — 실제 인쇄본과는 다를 수 있어요</div>';
    var pv = document.getElementById("bookPrev"), nv = document.getElementById("bookNext");
    if (pv) pv.addEventListener("click", function(){ turnBookPage(m, -1); });
    if (nv) nv.addEventListener("click", function(){ turnBookPage(m, 1); });
  } else if (m.bookSpread) {
    area.innerHTML = modeToggle +
      '<div class="book-outer"><div class="book-shell spread"><div class="book-edit-flow-wrap"><div class="book-edit-flow spread" id="bookEditFlow" contenteditable="true" spellcheck="true"></div></div></div></div>' +
      '<div class="book-hint">두 쪽 보기로 씁니다 — 옆으로 스크롤하면 다음 쪽으로 이어져요</div>';
    var flowEl = document.getElementById("bookEditFlow");
    flowEl.textContent = m.text || "";
    flowEl.addEventListener("input", function(){
      m.text = flowEl.innerText.split(String.fromCharCode(160)).join(" ");
      var denom0 = flowEl.scrollWidth - flowEl.clientWidth;
      m.editScrollFrac = denom0 > 0 ? Math.max(0, Math.min(1, flowEl.scrollLeft/denom0)) : 0;
      saveData(); updateMsCharCount(m); updateMsStatsBar(m); updateMsGoalBar(m); updateCharacterChips(m, bookWorkId); flashSaveIndicator();
    });
    flowEl.addEventListener("scroll", function(){
      var denom = flowEl.scrollWidth - flowEl.clientWidth;
      m.editScrollFrac = denom > 0 ? Math.max(0, Math.min(1, flowEl.scrollLeft/denom)) : 0;
    });
    requestAnimationFrame(function(){
      var denom = flowEl.scrollWidth - flowEl.clientWidth;
      if (denom > 0) flowEl.scrollLeft = (m.editScrollFrac||0) * denom;
    });
  } else {
    area.innerHTML = modeToggle +
      '<div class="book-outer"><div class="book-shell"><textarea class="book-edit-textarea" id="bookEditText" spellcheck="true" placeholder="여기에 소설 본문을 적어보세요.">'+esc(m.text||"")+'</textarea></div></div>' +
      '<div class="book-hint">쓰기 모드는 스크롤로 이어 씁니다 — 미리보기에서 페이지 단위로 넘겨볼 수 있어요</div>';
    var editEl = document.getElementById("bookEditText");
    editEl.addEventListener("input", function(e){ m.text = e.target.value; m.editScrollFrac = editScrollFraction(); saveData(); updateMsCharCount(m); updateMsStatsBar(m); updateMsGoalBar(m); updateCharacterChips(m, bookWorkId); flashSaveIndicator(); });
    editEl.addEventListener("scroll", function(){ m.editScrollFrac = editScrollFraction(); });
    requestAnimationFrame(function(){
      var denom = editEl.scrollHeight - editEl.clientHeight;
      if (denom > 0) editEl.scrollTop = (m.editScrollFrac||0) * denom;
    });
  }
  document.getElementById("bookSingleBtn").addEventListener("click", function(){
    if (!m.bookSpread) return;
    var oldPages = paginateBook(m);
    var frac = oldPages.length > 1 ? (m.bookPage||0) / (oldPages.length-1) : 0;
    m.bookSpread = false;
    var newPages = paginateBook(m);
    m.bookPage = Math.round(frac * Math.max(0, newPages.length-1));
    saveData(); renderBookArea(m);
  });
  document.getElementById("bookSpreadBtn").addEventListener("click", function(){
    if (m.bookSpread) return;
    var oldPages = paginateBook(m);
    var frac = oldPages.length > 1 ? (m.bookPage||0) / (oldPages.length-1) : 0;
    m.bookSpread = true;
    var newPages = paginateBook(m);
    m.bookPage = Math.round(frac * Math.max(0, newPages.length-1));
    saveData(); renderBookArea(m);
  });
}
function turnBookPage(m, dir) {
  var pages = paginateBook(m);
  var step = m.bookSpread ? dir * 2 : dir;
  var next = Math.max(0, Math.min(pages.length - 1, (m.bookPage||0) + step));
  if (next === m.bookPage) return;
  var contentEls = m.bookSpread
    ? [document.getElementById("bookPageContentL"), document.getElementById("bookPageContentR")].filter(Boolean)
    : [document.getElementById("bookPageContent")].filter(Boolean);
  if (!contentEls.length) { m.bookPage = next; saveData(); renderBookArea(m); return; }
  contentEls.forEach(function(el){ el.classList.add(dir > 0 ? "fo-next" : "fo-prev"); });
  setTimeout(function(){ m.bookPage = next; saveData(); renderBookArea(m); }, 150);
}

function renderManuscriptPage(m) {
  if (m.previewFontSize === undefined) m.previewFontSize = 16;
  if (m.previewFont === undefined) m.previewFont = "sans";
  if (m.previewDark === undefined) m.previewDark = false;
  if (m.bookMode === undefined) m.bookMode = "edit";
  if (m.bookPage === undefined) m.bookPage = 0;
  if (m.bookSpread === undefined) m.bookSpread = false;
  if (m.editScrollFrac === undefined) m.editScrollFrac = 0;
  if (m.format === undefined) m.format = "general";

  var main = document.getElementById("main");
  var isBook = m.format === "general";
  var isPlain = m.format === "plain";

  var novelOfMs = NOVELS.find(function(n){ return n.id === m.novelId; });
  var msWorkId = novelOfMs ? novelOfMs.workId : null;
  var povHtml = '<div class="pov-row"><span class="pov-label">'+ic("person",13)+'<span>등장인물</span></span><div class="chip-row" id="msCharacterChips" style="flex:1"></div></div>';

  var prevMs = prevManuscriptOf(m);
  var peekHtml = prevMs ?
    '<div class="ms-peek">' +
      '<button type="button" class="ms-peek-toggle" id="msPeekToggle">'+ic("chevron",11)+' 이전 화("'+esc(prevMs.title||"제목 없음")+'") 이어보기</button>' +
      '<div class="ms-peek-body" id="msPeekBody" style="display:none">'+esc(tailText(prevMs.text, 220))+'</div>' +
    '</div>' : '';

  var statsHtml = '<div class="ms-stats-bar" id="msStatsBar"></div>' +
    '<div class="ms-goal-row">' +
      '<label class="ms-goal-label" for="msGoalInput">'+ic("star",12)+'목표 글자수</label>' +
      '<input type="number" min="0" step="100" class="ms-goal-input" id="msGoalInput" value="'+(m.goalChars?m.goalChars:"")+'" placeholder="예: 5000">' +
      '<div class="ms-goal-bar-wrap" id="msGoalBarWrap"></div>' +
    '</div>' +
    peekHtml +
    '<div class="ms-spellcheck-hint">맞춤법 검사가 켜져 있어요 — 캐릭터 이름 같은 고유명사에 빨간 밑줄이 뜨면, 그 단어 위에서 마우스 오른쪽 버튼을 눌러 "사전에 추가"를 선택하면 이후로는 표시되지 않아요.</div>';

  var tabsHtml = '<div class="ms-tabs">' + Object.keys(MS_FORMATS).map(function(key){
    return '<button type="button" class="ms-tab '+(m.format===key?"on":"")+'" data-msformat="'+key+'">'+esc(MS_FORMATS[key].label)+'</button>';
  }).join("") + '</div>';

  var focusBtnHtml = '<button type="button" id="msFocusToggle" class="'+(state.focusMode?"on":"")+'" title="사이드바를 숨기고 집중해서 씁니다">'+ic("eye",13)+'<span>집중 모드</span></button><div class="sep"></div>';

  var bodyHtml;
  if (isBook) {
    bodyHtml =
      '<div class="ms-controls">' +
        focusBtnHtml +
        '<button type="button" class="'+(m.bookMode!=="view"?"on":"")+'" id="msEditBtn">'+ic("p",13)+'<span>쓰기</span></button>' +
        '<button type="button" class="'+(m.bookMode==="view"?"on":"")+'" id="msViewBtn">'+ic("docIcon",13)+'<span>미리보기</span></button>' +
        (m.bookMode!=="view" && !m.bookSpread ? '<div class="sep"></div><button type="button" id="msFindBtnBook">'+ic("search",13)+'<span>찾아바꾸기</span></button>' : '') +
      '</div>' +
      '<div id="bookArea"></div>';
  } else {
    var textareaHtml = '<textarea class="ms-textarea'+(isPlain?" ms-doc-textarea":"")+'" id="msText" spellcheck="true" placeholder="여기에 소설 본문을 적어보세요.">'+esc(m.text||"")+'</textarea>';
    bodyHtml =
      '<div class="ms-controls">' +
        focusBtnHtml +
        '<button type="button" id="msDarkToggle" class="'+(m.previewDark?"on":"")+'">'+ic(m.previewDark?"moon":"sun",13)+'<span>다크 모드</span></button>' +
        '<div class="sep"></div>' +
        '<button type="button" id="msFontDec">A-</button>' +
        '<span class="ms-fontsize-val" id="msFontVal">'+m.previewFontSize+'px</span>' +
        '<button type="button" id="msFontInc">A+</button>' +
        '<div class="sep"></div>' +
        '<select class="sel" id="msFontFamily">' + Object.keys(MS_FONTS).map(function(k){ return '<option value="'+k+'" '+(m.previewFont===k?"selected":"")+'>'+MS_FONTS[k].label+'</option>'; }).join("") + '</select>' +
        '<div class="sep"></div>' +
        '<button type="button" id="msFindBtn">'+ic("search",13)+'<span>찾아바꾸기</span></button>' +
      '</div>' +
      (isPlain
        ? '<div class="ms-doc-page"><div class="ms-doc-ruler"></div><div class="ms-doc-screen">' + textareaHtml + '</div></div>'
        : '<div class="ms-frame"><div class="ms-notch"></div><div class="ms-screen">' + textareaHtml + '</div></div>');
  }

  main.innerHTML =
    '<div class="graph-shell">' +
      '<div class="graph-title-bar"><input class="graph-title" id="msTitle" value="'+esc(m.title)+'" placeholder="원고(화) 제목"><span class="ms-save-indicator saved" id="msSaveIndicator">저장됨</span><span class="ms-char-count" id="msCharCount">'+fmtNum(charCount(m.text))+'자</span><button class="page-del" id="deleteMsBtn" style="margin-top:0">'+ic("trash",13)+'<span>원고 삭제</span></button></div>' +
      '<div class="page-pad" style="padding-top:26px">' + povHtml + statsHtml + tabsHtml + bodyHtml + '</div>' +
    '</div>';

  document.getElementById("msTitle").addEventListener("input", function(e){ m.title = e.target.value; saveData(); renderSidebar(); updateMsStatsBar(m); flashSaveIndicator(); });
  document.getElementById("deleteMsBtn").addEventListener("click", function(){ deleteManuscript(m.id); });
  updateCharacterChips(m, msWorkId, true);
  updateMsStatsBar(m);
  updateMsGoalBar(m);
  main.querySelectorAll("[data-msformat]").forEach(function(btn){
    btn.addEventListener("click", function(){ m.format = btn.dataset.msformat; saveData(); renderManuscriptPage(m); });
  });
  var goalInput = document.getElementById("msGoalInput");
  if (goalInput) goalInput.addEventListener("input", function(e){
    var v = parseInt(e.target.value, 10);
    m.goalChars = isNaN(v) || v <= 0 ? null : v;
    saveData(); updateMsGoalBar(m);
  });
  var peekToggle = document.getElementById("msPeekToggle");
  if (peekToggle) peekToggle.addEventListener("click", function(){
    var body = document.getElementById("msPeekBody");
    var willOpen = body.style.display === "none";
    body.style.display = willOpen ? "block" : "none";
    peekToggle.classList.toggle("open", willOpen);
  });
  var focusToggle = document.getElementById("msFocusToggle");
  if (focusToggle) focusToggle.addEventListener("click", function(){
    state.focusMode = !state.focusMode;
    applyFocusModeClass();
    focusToggle.classList.toggle("on", state.focusMode);
  });

  if (isBook) {
    document.getElementById("msEditBtn").addEventListener("click", function(){
      var pages = paginateBook(m);
      m.editScrollFrac = pages.length > 1 ? (m.bookPage||0) / (pages.length-1) : 0;
      m.bookMode = "edit"; saveData(); renderManuscriptPage(m);
    });
    document.getElementById("msViewBtn").addEventListener("click", function(){
      var pages = paginateBook(m);
      m.bookPage = Math.round((m.editScrollFrac||0) * Math.max(0, pages.length-1));
      m.bookMode = "view"; saveData(); renderManuscriptPage(m);
    });
    var findBtnBook = document.getElementById("msFindBtnBook");
    if (findBtnBook) findBtnBook.addEventListener("click", function(e){
      openFindReplace("bookEditText", e.currentTarget, function(newVal){
        m.text = newVal; saveData(); updateMsCharCount(m); updateMsStatsBar(m); updateMsGoalBar(m); updateCharacterChips(m, msWorkId, true); flashSaveIndicator();
      });
    });
    renderBookArea(m);
  } else {
    applyMsStyle(m);
    document.getElementById("msText").addEventListener("input", function(e){ m.text = e.target.value; saveData(); updateMsCharCount(m); updateMsStatsBar(m); updateMsGoalBar(m); updateCharacterChips(m, msWorkId); flashSaveIndicator(); });
    document.getElementById("msDarkToggle").addEventListener("click", function(){ m.previewDark = !m.previewDark; saveData(); renderManuscriptPage(m); });
    document.getElementById("msFontDec").addEventListener("click", function(){ m.previewFontSize = Math.max(13, m.previewFontSize-1); saveData(); applyMsStyle(m); document.getElementById("msFontVal").textContent = m.previewFontSize+"px"; });
    document.getElementById("msFontInc").addEventListener("click", function(){ m.previewFontSize = Math.min(20, m.previewFontSize+1); saveData(); applyMsStyle(m); document.getElementById("msFontVal").textContent = m.previewFontSize+"px"; });
    document.getElementById("msFontFamily").addEventListener("change", function(e){ m.previewFont = e.target.value; saveData(); applyMsStyle(m); });
    document.getElementById("msFindBtn").addEventListener("click", function(e){
      openFindReplace("msText", e.currentTarget, function(newVal){
        m.text = newVal; saveData(); updateMsCharCount(m); updateMsStatsBar(m); updateMsGoalBar(m); updateCharacterChips(m, msWorkId, true); flashSaveIndicator();
      });
    });
  }
}

/* ---------------- 수필·자서전 entry editor ----------------
 * Deliberately simpler than renderManuscriptPage: no platform format tabs, no
 * paginated "book" preview mode, no POV auto-detection -- just a plain writing
 * surface (font/size/dark controls + find/replace + char count/goal, all lifted
 * straight from the manuscript editor) plus the three fields that actually matter
 * for an essay/memoir piece: 시기(period), 주제 태그, 관련 인물. */
function essayCollectionStats(essayId) {
  var entries = ESSAY_ENTRIES.filter(function(e){ return e.essayId === essayId; });
  var total = entries.reduce(function(s,e){ return s+charCount(e.text); }, 0);
  var avg = entries.length ? Math.round(total/entries.length) : 0;
  return { count: entries.length, total: total, avg: avg };
}
function updateEsCharCount(e) {
  var el = document.getElementById("esCharCount");
  if (el) el.textContent = fmtNum(charCount(e.text)) + "자";
}
function updateEsStatsBar(e) {
  var el = document.getElementById("esStatsBar");
  if (!el) return;
  var st = essayCollectionStats(e.essayId);
  el.innerHTML =
    '<span>이 글 <b>'+fmtNum(charCount(e.text))+'</b>자</span>' +
    '<span>폴더 전체 <b>'+fmtNum(st.total)+'</b>자 ('+st.count+'편)</span>' +
    '<span>편 평균 <b>'+fmtNum(st.avg)+'</b>자</span>';
}
function updateEsGoalBar(e) {
  var wrap = document.getElementById("esGoalBarWrap");
  if (!wrap) return;
  var goal = Number(e.goalChars) || 0;
  if (!goal) { wrap.innerHTML = ""; return; }
  var cur = charCount(e.text);
  var pct = Math.round((cur/goal)*100);
  var barPct = Math.max(0, Math.min(100, pct));
  wrap.innerHTML =
    '<div class="ms-goal-bar-track"><div class="ms-goal-bar-fill'+(pct>=100?" done":"")+'" style="width:'+barPct+'%"></div></div>' +
    '<span class="ms-goal-pct">'+fmtNum(cur)+' / '+fmtNum(goal)+'자 ('+pct+'%)</span>';
}
var esSaveTimer = null;
function flashEsSaveIndicator() {
  var el = document.getElementById("esSaveIndicator");
  if (!el) return;
  el.textContent = "저장 중…";
  el.classList.remove("saved");
  clearTimeout(esSaveTimer);
  esSaveTimer = setTimeout(function(){ el.textContent = "저장됨"; el.classList.add("saved"); }, 500);
}
function applyEsStyle(e) {
  var el = document.getElementById("esText");
  if (!el) return;
  var f = MS_FORMATS.plain;
  var dark = !!e.previewDark;
  el.style.fontSize = (e.previewFontSize||16) + "px";
  el.style.lineHeight = f.lineHeight;
  el.style.padding = f.pad;
  el.style.background = dark ? "#1C1C1A" : f.bg;
  el.style.color = dark ? "#E7E4DC" : f.color;
  el.style.letterSpacing = f.spacing;
  el.style.fontFamily = (MS_FONTS[e.previewFont||"sans"]||MS_FONTS.sans).family;
}
function renderEssayTagChips(e) {
  var container = document.getElementById("esTagChips");
  if (!container) return;
  var html = (e.themeTags||[]).map(function(tag, i){
    return '<span class="chip">'+esc(tag)+'<button data-rmestag="'+i+'" title="삭제">'+ic("close",10)+'</button></span>';
  }).join("") + '<button type="button" class="chip-add" data-addestag="1">'+ic("plus",10)+' 추가</button>';
  container.innerHTML = html;
  container.querySelectorAll("[data-rmestag]").forEach(function(btn){
    btn.addEventListener("click", function(ev){
      ev.stopPropagation();
      e.themeTags.splice(parseInt(btn.dataset.rmestag, 10), 1);
      saveData(); renderEssayTagChips(e);
    });
  });
  var addBtn = container.querySelector("[data-addestag]");
  if (addBtn) addBtn.addEventListener("click", function(){
    var input = document.createElement("input");
    input.className = "chip-input"; input.placeholder = "입력 후 Enter";
    addBtn.replaceWith(input); input.focus();
    var committed = false;
    function commit(){
      if (committed) return; committed = true;
      var v = input.value.trim();
      if (v) { e.themeTags = (e.themeTags||[]).concat([v]); saveData(); }
      renderEssayTagChips(e);
    }
    input.addEventListener("keydown", function(ev){ if (ev.key==="Enter"){ ev.preventDefault(); commit(); } if (ev.key==="Escape") { committed = true; renderEssayTagChips(e); } });
    input.addEventListener("blur", commit);
  });
}
function updateEssayPeopleChips(e, workId) {
  var container = document.getElementById("esPeopleChips");
  if (!container) return;
  var charDocs = DOCS.filter(function(d){ return d.workId===workId && d.category==="등장인물"; });
  var html = (e.relatedCharacterIds||[]).map(function(id){
    var d = charDocs.find(function(d){ return d.id===id; });
    if (!d) return "";

function wireScriptPage(sc) {
  document.getElementById("scTitle").addEventListener("input", function(e){ sc.title = e.target.value; saveData(); renderSidebar(); });
  document.getElementById("deleteScriptBtn").addEventListener("click", function(){ deleteScript(sc.id); });

  scState.strokes = []; scState.curPts = null; scState.smoothPt = null; scState.editingGlyphId = null;
  var pad = document.getElementById("glyphPad");
  var mapToInput = document.getElementById("glyphMapTo");
  var noteInput = document.getElementById("glyphNote");
  var saveLabel = document.getElementById("glyphSaveLabel");
  scRenderPad();

  function ptFromEvent(e) {
    var rect = pad.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (SC_PAD_SIZE/rect.width);
    var y = (e.clientY - rect.top) * (SC_PAD_SIZE/rect.height);
    return [Math.max(0, Math.min(SC_PAD_SIZE, x)), Math.max(0, Math.min(SC_PAD_SIZE, y))];
  }
  pad.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if (pad.setPointerCapture) { try { pad.setPointerCapture(e.pointerId); } catch (err) {} }
    var p = ptFromEvent(e);
    scState.curPts = [p];
    scState.smoothPt = p;
    scRenderPad();
  });
  pad.addEventListener("pointermove", function(e){
    if (!scState.curPts) return;
    var raw = ptFromEvent(e);
    var alpha = 0.4;
    scState.smoothPt = [
      scState.smoothPt[0] + (raw[0]-scState.smoothPt[0])*alpha,
      scState.smoothPt[1] + (raw[1]-scState.smoothPt[1])*alpha
    ];
    scState.curPts.push(scState.smoothPt.slice());
    scRenderPad();
  });
  function finishStroke() {
    if (scState.curPts && scState.curPts.length) scState.strokes.push(scPointsToPath(scState.curPts));
    scState.curPts = null; scState.smoothPt = null;
    scRenderPad();
  }
  pad.addEventListener("pointerup", finishStroke);
  pad.addEventListener("pointerleave", function(){ if (scState.curPts) finishStroke(); });

  document.getElementById("glyphUndoBtn").addEventListener("click", function(){ scState.strokes.pop(); scRenderPad(); });
  document.getElementById("glyphClearBtn").addEventListener("click", function(){ scState.strokes = []; scState.curPts = null; scRenderPad(); });

  document.getElementById("glyphSaveBtn").addEventListener("click", function(){
    if (!scState.strokes.length) return;
    var mapTo = mapToInput.value.trim();
    var note = noteInput.value.trim();
    if (scState.editingGlyphId) {
      var g = sc.glyphs.find(function(g){ return g.id === scState.editingGlyphId; });
      if (g) { g.strokes = scState.strokes.slice(); g.mapTo = mapTo; g.note = note; }
    } else {
      sc.glyphs.push({ id: uid(), strokes: scState.strokes.slice(), mapTo: mapTo, note: note });
    }
    saveData();
    renderScriptPage(sc);
  });

  document.querySelectorAll("[data-editglyph]").forEach(function(card){
    card.addEventListener("click", function(e){
      if (e.target.closest("[data-delglyph]")) return;
      var g = sc.glyphs.find(function(g){ return g.id === card.dataset.editglyph; });
      if (!g || !g.strokes || !g.strokes.length) return; // 참고용 폰트 글자는 손그림 수정 대상이 아님
      scState.strokes = g.strokes.slice();
      scState.curPts = null;
      scState.editingGlyphId = g.id;
      mapToInput.value = g.mapTo || "";
      noteInput.value = g.note || "";
      saveLabel.textContent = "이 글자 수정 저장";
      scRenderPad();
      pad.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
  document.querySelectorAll("[data-delglyph]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      sc.glyphs = sc.glyphs.filter(function(g){ return g.id !== btn.dataset.delglyph; });
      saveData(); renderScriptPage(sc);
    });
  });

  ["words","sentences"].forEach(function(field){
    document.querySelectorAll('[data-pairfield="'+field+'"] .pair-row').forEach(function(row){
      var id = row.dataset.pairid;
      row.querySelectorAll("[data-pairside]").forEach(function(inp){
        inp.addEventListener("input", function(){
          var p = sc[field].find(function(p){ return p.id === id; });
          if (p) { p[inp.dataset.pairside] = inp.value; saveData(); }
        });
      });
    });
  });
  document.querySelectorAll("[data-delpair]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var row = btn.closest("[data-pairid]");
      var field = row.parentElement.dataset.pairfield;
      sc[field] = sc[field].filter(function(p){ return p.id !== row.dataset.pairid; });
      saveData(); renderScriptPage(sc);
    });
  });
  document.querySelectorAll("[data-addpair]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var field = btn.dataset.addpair;
      sc[field].push({ id: uid(), a: "", b: "" });
      saveData();
      renderScriptPage(sc);
      var rows = document.querySelectorAll('[data-pairfield="'+field+'"] .pair-row');
      var last = rows[rows.length-1];
      if (last) last.querySelector('[data-pairside="a"]').focus();
    });
  });

  var typeInput = document.getElementById("scTypeInput");
  var outputSvgWrap = document.getElementById("scOutputWrap");
  function refreshTypingOutput() { outputSvgWrap.innerHTML = renderGlyphSequenceSvg(sc, typeInput.value); }
  /* 실제 키보드 입력은 물리 키 위치(e.code) 기준으로 직접 값을 조립한다 — 한/영 전환 상태에 따라
     브라우저 IME가 만들어내는 문자가 달라지는 문제를 피하기 위함. 붙여넣기나 IME 조합으로 다른 문자가
     섞여 들어오는 경우를 대비해 input 이벤트에서도 허용된 문자만 남기고 나머지는 걸러낸다. */
  typeInput.addEventListener("keydown", function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === "Backspace" || e.code === "Delete") return;
    if (e.code === "Enter") { e.preventDefault(); return; }
    var mapped = TYPE_CODE_TO_CHAR[e.code];
    if (mapped === undefined) { e.preventDefault(); return; }
    e.preventDefault();
    var ch = (e.shiftKey && /^[a-z]$/.test(mapped)) ? mapped.toUpperCase() : mapped;
    var start = typeInput.selectionStart, end = typeInput.selectionEnd;
    var val = typeInput.value;
    typeInput.value = val.slice(0, start) + ch + val.slice(end);
    typeInput.selectionStart = typeInput.selectionEnd = start + 1;
    refreshTypingOutput();
  });
  typeInput.addEventListener("input", function(){
    var clean = sanitizeTypedText(typeInput.value);
    if (clean !== typeInput.value) {
      var pos = Math.max(0, typeInput.selectionStart - (typeInput.value.length - clean.length));
      typeInput.value = clean;
      try { typeInput.selectionStart = typeInput.selectionEnd = pos; } catch (err) {}
    }
    refreshTypingOutput();
  });
  refreshTypingOutput();

  document.querySelectorAll(".kb-key").forEach(function(btn){
    btn.addEventListener("mousedown", function(){ btn.classList.add("pressed"); });
    btn.addEventListener("mouseup", function(){ btn.classList.remove("pressed"); });
    btn.addEventListener("mouseleave", function(){ btn.classList.remove("pressed"); });
    btn.addEventListener("click", function(){
      if (btn.dataset.char === undefined) return;
      typeInput.value += btn.dataset.char;
      typeInput.focus();
      refreshTypingOutput();
    });
  });
  document.querySelectorAll("[data-kblayout]").forEach(function(btn){
    btn.addEventListener("click", function(){ scState.kbLayout = btn.dataset.kblayout; renderScriptPage(sc); });
  });
}

/* ---------------- root render ---------------- */
function render() {
  renderSidebar();
  applyFocusModeClass();
  window.onkeydown = null;
  hideRegionTooltip();
  if (state.mode === "doc") {
    var d = currentDoc();
    if (d) { renderDocPage(d); return; }
  }
  if (state.mode === "doccat") {
    var parts = (state.activeId||"").split("::");
    if (parts.length===2 && WORKS.some(function(w){ return w.id===parts[0]; })) { renderDocCategoryPage(parts[0], parts[1]); return; }
  }
  if (state.mode === "graph") {
    var g = currentGraph();
    if (g) { renderGraphPage(g); return; }
  }
  if (state.mode === "table") {
    var tb = currentTable();
    if (tb) { renderTablePage(tb); return; }
  }
  if (state.mode === "timeline") {
    var tl = currentTimeline();
    if (tl) { renderTimelinePage(tl); return; }
  }
  if (state.mode === "map") {
    var mp = currentMap();
    if (mp) { renderMapPage(mp); return; }
  }
  if (state.mode === "units") {
    var uw = WORKS.find(function(w){ return w.id === state.activeId; });
    if (uw) { renderUnitsPage(uw); return; }
  }
  if (state.mode === "sports") {
    var sp = SPORTS.find(function(s){ return s.id === state.activeId; });
    if (sp) { renderSportsPage(sp); return; }
  }
  if (state.mode === "manuscript") {
    var m = currentManuscript();
    if (m) { renderManuscriptPage(m); return; }
  }
  if (state.mode === "essayentry") {
    var esE = ESSAY_ENTRIES.find(function(x){ return x.id === state.activeId; });
    if (esE) { renderEssayEntryPage(esE); return; }
  }
  if (state.mode === "script") {
    var sc = currentScript();
    if (sc) { renderScriptPage(sc); return; }
  }
  if (state.mode === "search" && state.query.trim()) {
    renderSearchPage(state.query);
    return;
  }
  window.onkeydown = null;
  renderHomePage();
}

/* ---------------- backup / restore ---------------- */
function exportData() {
  var data = { docs: DOCS, graphs: GRAPHS, manuscripts: MANUSCRIPTS, novels: NOVELS, works: WORKS, tables: TABLES, timelines: TIMELINES, maps: MAPS, sports: SPORTS, scripts: SCRIPTS, essays: ESSAYS, essayEntries: ESSAY_ENTRIES, exportedAt: new Date().toISOString(), appVersion: 1 };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = "집썰_백업_"+stamp+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function importDataFile(file) {
  var reader = new FileReader();
  reader.onload = function(e){
    var parsed;
    try { parsed = JSON.parse(e.target.result); } catch (err) {
      openModal({ title: "가져오기 실패", message: "올바른 백업 파일(JSON)이 아닙니다.", confirmLabel: "확인" });
      return;
    }
    openModal({
      title: "데이터를 불러올까요?",
      message: "현재 브라우저에 저장된 모든 작품·문서·원고 데이터가 이 백업 파일 내용으로 통째로 바뀝니다. 되돌릴 수 없어요.",
      confirmLabel: "불러오기", danger: true,
      onConfirm: function(){
        DOCS = parsed.docs || [];
        GRAPHS = parsed.graphs || [];
        MANUSCRIPTS = parsed.manuscripts || [];
        NOVELS = parsed.novels || [];
        WORKS = parsed.works || [];
        TABLES = parsed.tables || [];
        TIMELINES = parsed.timelines || [];
        MAPS = parsed.maps || [];
        SPORTS = parsed.sports || [];
        SCRIPTS = parsed.scripts || [];
        ESSAYS = parsed.essays || [];
        ESSAY_ENTRIES = parsed.essayEntries || [];
        state.mode = "empty"; state.activeId = null; state.collapsed = {};
        saveData(); render();
      }
    });
  };
  reader.readAsText(file);
}
document.getElementById("exportBtn").addEventListener("click", exportData);

document.getElementById("importFile").addEventListener("change", function(e){

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --bg-card: #1f2023; --bg-card-hover: #26282b; --bg-sidebar: #1b1c1f;
    --ink: #eceef0; --ink-soft: #b7bac0; --ink-faint: #74777d;
    --border: #2c2e32; --border-strong: #383b40;
    --shadow: rgba(0,0,0,0.4);
    --accent-strong: color-mix(in srgb, var(--accent) 78%, white);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--ink);
  font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wb-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.wb-sidebar {
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 4px;
}
.wb-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 6px 8px 16px; }
.wb-brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
.wb-nav-label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .05em; padding: 14px 8px 6px; }
.wb-nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px;
  color: var(--ink-soft); font-size: 13.5px; transition: background .12s, color .12s;
}
.wb-nav-item:hover { background: var(--bg-card-hover); color: var(--ink); text-decoration: none; }
.wb-nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.wb-nav-item .cnt { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.wb-nav-item.active .cnt { color: var(--accent-strong); }

/* Category-with-entities row: one dense line (chevron + "라벨 · 개수", like the
 * editor app's own "세력 · 18" sidebar heading) instead of a separate pill nav item
 * plus a detached toggle button -- this mirrors the app's actual sb-head/doc-row
 * tree exactly, per the user's explicit reference screenshot of that sidebar,
 * rather than an independently-designed dropdown. */
.wb-sb-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.wb-sb-head:hover { background: var(--bg-card-hover); }
.wb-sb-chev { color: var(--ink-faint); display: flex; flex: none; transition: transform .12s ease; }
.wb-sb-chev.collapsed { transform: rotate(-90deg); }
.wb-sb-cat-label {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.wb-sb-head:hover .wb-sb-cat-label { color: var(--ink); text-decoration: none; }
.wb-sb-cat-label.active { color: var(--accent-strong); font-weight: 600; }
.wb-sb-cat-label .cnt { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; flex: none; }

.wb-sb-sub { display: flex; flex-direction: column; gap: 1px; padding-bottom: 2px; }
.wb-sb-sub.collapsed { display: none; }
.wb-doc-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 30px; border-radius: 7px;
  font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wb-doc-row:hover { background: var(--bg-card-hover); color: var(--ink); text-decoration: none; }
.wb-doc-row.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.wb-doc-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--border-strong); }
.wb-doc-row.active .wb-doc-dot { background: var(--accent-strong); }

.wb-main { min-width: 0; padding: 26px 34px 60px; }
.wb-overlay { display: none; }
.wb-topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.wb-search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 460px; }
.wb-search {
  width: 100%; padding: 10px 14px 10px 36px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: var(--bg-card); color: var(--ink); font-size: 13.5px;
}
.wb-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.wb-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
.wb-search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-card);
  border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 8px 28px var(--shadow);
  max-height: 360px; overflow-y: auto; z-index: 40; display: none;
}
.wb-search-results.open { display: block; }
.wb-search-result { display: block; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.wb-search-result:last-child { border-bottom: none; }
.wb-search-result:hover { background: var(--bg-card-hover); text-decoration: none; }
.wb-search-result .k { font-size: 10.5px; color: var(--accent); font-weight: 600; }
.wb-search-result .t { font-size: 13.5px; color: var(--ink); margin-top: 1px; }
.wb-search-result .s { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb-search-empty { padding: 16px; text-align: center; color: var(--ink-faint); font-size: 12.5px; }

.wb-theme-toggle { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.wb-icon-btn {
  display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 9px; border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--ink-soft);
  cursor: pointer;
}
.wb-icon-btn:hover { background: var(--bg-card-hover); color: var(--ink); }
.wb-settings-pop {
  position: absolute; top: calc(100% + 8px); right: 0; width: 260px; background: var(--bg-card);
  border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 10px 32px var(--shadow);
  padding: 14px; z-index: 50; display: none;
}
.wb-settings-pop.open { display: block; }
.wb-settings-label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 8px; }
.wb-settings-label:first-child { margin-top: 0; }
.wb-mode-row { display: flex; gap: 6px; }
.wb-mode-btn { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink-soft); font-size: 12.5px; cursor: pointer; }
.wb-mode-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
.wb-accent-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wb-accent-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.wb-accent-swatch.on { border-color: var(--ink); }
.wb-accent-custom-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.wb-accent-custom-row input[type=color] { width: 30px; height: 30px; border: none; border-radius: 6px; padding: 0; background: none; cursor: pointer; }
.wb-accent-custom-row input[type=text] { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); font-size: 12px; }

.wb-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.wb-filter-chip { padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--ink-soft); font-size: 12.5px; cursor: pointer; }
.wb-filter-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.wb-h1 { font-size: 25px; font-weight: 700; margin: 0 0 6px; }
.wb-sub { color: var(--ink-faint); font-size: 13.5px; margin: 0 0 24px; }
.wb-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 12px; margin-bottom: 28px; }
.wb-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 3px var(--shadow); }
.wb-stat-card .n { font-size: 22px; font-weight: 700; }
.wb-stat-card .l { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

.wb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 14px; }
.wb-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: 0 1px 3px var(--shadow); transition: transform .14s, box-shadow .14s, border-color .14s;
  display: flex; flex-direction: column; gap: 6px;
}
.wb-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px var(--shadow); border-color: var(--accent); text-decoration: none; }
.wb-card .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; margin-bottom: 4px; }
.avatar-icon svg { width: 20px; height: 20px; }
.wb-detail-avatar.avatar-icon svg { width: 32px; height: 32px; }
.wb-card .name { font-size: 15px; font-weight: 700; color: var(--ink); }
.wb-card .alias { font-size: 11.5px; color: var(--ink-faint); }
.wb-card .desc { font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wb-card .tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.wb-tag { font-size: 10.5px; padding: 3px 8px; border-radius: 12px; background: var(--bg-card-hover); color: var(--ink-faint); }
.wb-empty { color: var(--ink-faint); font-size: 13px; padding: 40px 0; text-align: center; }

.wb-detail-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 1px 3px var(--shadow); padding: 24px; margin-bottom: 18px; }
.wb-detail-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 4px; }
.wb-detail-avatar { width: 76px; height: 76px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; flex: none; }
.wb-detail-title { font-size: 24px; font-weight: 700; }
.wb-detail-alias { color: var(--ink-faint); font-size: 13px; margin-top: 2px; }
.wb-field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; margin-top: 18px; }
.wb-field { }
.wb-field .k { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
.wb-field .v { font-size: 14px; color: var(--ink); }
.wb-section-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 22px 0 10px; display: flex; align-items: center; gap: 6px; }
.wb-prose p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.75; color: var(--ink-soft); }
.wb-prose h1, .wb-prose h2, .wb-prose h3 { font-size: 14.5px; margin: 16px 0 6px; color: var(--ink); }

.wb-rel-list { display: flex; flex-direction: column; gap: 8px; }
.wb-rel-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
.wb-rel-row .rn { font-weight: 600; font-size: 13px; }
.wb-rel-row .rk { font-size: 11.5px; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 8px; border-radius: 10px; }
.wb-rel-row .rm { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; }

.wb-ep-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.wb-ep-chip { font-size: 11.5px; padding: 5px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--ink-soft); }

.wb-timeline { position: relative; padding-left: 28px; }
.wb-timeline::before { content:""; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border-strong); }
.wb-tl-item { position: relative; padding-bottom: 26px; }
.wb-tl-item::before { content:""; position: absolute; left: -24px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--accent); }
.wb-tl-label { font-size: 11.5px; color: var(--accent-strong); font-weight: 700; margin-bottom: 3px; }
.wb-tl-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.wb-tl-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.65; }
.wb-tl-group { font-size: 12px; color: var(--ink-faint); margin: 22px 0 10px; text-transform: uppercase; letter-spacing: .04em; }

@media (max-width: 900px) {
  .wb-shell { grid-template-columns: 1fr; }
  .wb-sidebar {
    position: fixed; left: 0; top: 0; z-index: 100; width: 260px; transform: translateX(-100%);
    transition: transform .2s; box-shadow: 0 0 30px var(--shadow);
  }
  .wb-sidebar.open { transform: translateX(0); }
  .wb-hamburger { display: flex !important; }
  .wb-main { padding: 18px 16px 50px; }
  .wb-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; }
  .wb-overlay.open { display: block; }
}
.wb-hamburger { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--ink-soft); cursor: pointer; flex: none; }

.wb-detail-image { width: 100%; max-width: 320px; border-radius: var(--radius); display: block; margin-bottom: 16px; background: var(--bg); }

  var LIST_RENDERERS = {

  /* ---------------- router ---------------- */
  function parseHash() {
    var h = location.hash.replace(/^#\\/?/, "");
    if (!h) return { key: "index", id: null };
    var slashIdx = h.indexOf("/");
    if (slashIdx === -1) return { key: h, id: null };
    return { key: h.slice(0, slashIdx), id: decodeURIComponent(h.slice(slashIdx + 1)) };
  }
  function updateActiveNav(key, id) {
    var links = document.querySelectorAll(".wb-nav-item");
    for (var i = 0; i < links.length; i++) links[i].classList.toggle("active", links[i].dataset.navkey === key && !id);
    var catLabels = document.querySelectorAll(".wb-sb-cat-label");
    for (var c = 0; c < catLabels.length; c++) catLabels[c].classList.toggle("active", catLabels[c].dataset.navkey === key && !id);
    var docRows = document.querySelectorAll(".wb-doc-row");
    for (var j = 0; j < docRows.length; j++) {
      docRows[j].classList.toggle("active", !!id && docRows[j].dataset.navkey === key && docRows[j].dataset.navid === id);
    }
    /* Auto-expand (never auto-collapse) the category the current page belongs to,
     * so following a search result or relationship link into e.g. a character
     * detail page reveals that character highlighted in the sidebar list. */
    var sub = document.querySelector('.wb-sb-sub[data-subkey="' + key + '"]');
    var head = document.querySelector('.wb-sb-head[data-togglekey="' + key + '"]');
    if (sub) sub.classList.remove("collapsed");
    if (head) {
      var chev = head.querySelector(".wb-sb-chev");
      if (chev) chev.classList.remove("collapsed");
    }
  }
  function renderRoute() {
    var r = parseHash();
    var key = LIST_RENDERERS[r.key] ? r.key : "index";
    var html = (r.id && DETAIL_RENDERERS[key]) ? DETAIL_RENDERERS[key](r.id) : LIST_RENDERERS[key]();
    var contentEl = document.getElementById("wbContent");
    if (contentEl) contentEl.innerHTML = html;
    updateActiveNav(key, r.id);
    wireFilters();
    var main = document.querySelector(".wb-main");
    if (main) main.scrollTop = 0;
    window.scrollTo(0, 0);
    closeMobileNav();
  }

  /* ---------------- sidebar (rendered once) ----------------
   * Mirrors the editor app's own sidebar tree (renderWorkBody's "세력 · 18" style
   * category rows) rather than an independently-designed dropdown: one dense line
   * per category -- inline chevron + "라벨 · 개수" -- where the chevron toggles an
   * indented list of that category's actual entities right underneath, and the
   * label itself is a plain link to the category's list page. Categories with no
   * entity list (index, timeline) stay a plain nav row. */
  function renderSidebar() {
    return NAV_ITEMS.map(function (n) {
      var list = itemsFor(n.key);
      if (!list) {
        var cnt = countFor(n.key);
        return '<a class="wb-nav-item" data-navkey="' + n.key + '" href="#' + (n.key === "index" ? "" : n.key) + '">' +
          ICONS[n.icon] + '<span>' + esc(n.label) + '</span>' + (cnt != null ? '<span class="cnt">' + cnt + '</span>' : "") + '</a>';
      }
      var headHtml = '<div class="wb-sb-head" data-togglekey="' + n.key + '">' +
        '<span class="wb-sb-chev collapsed">' + ICONS.chevron + '</span>' +
        '<a class="wb-sb-cat-label" data-navkey="' + n.key + '" href="#' + n.key + '">' +
        ICONS[n.icon] + '<span>' + esc(n.label) + (list.length ? ' · ' + list.length : '') + '</span>' +
        '</a></div>';
      var subHtml = '<div class="wb-sb-sub collapsed" data-subkey="' + n.key + '">' +
        list.map(function (item) {
          return '<a class="wb-doc-row" data-navkey="' + n.key + '" data-navid="' + esc(item.id) + '" href="' + linkFor(n.key, item.id) + '">' +
            '<span class="wb-doc-dot"></span><span>' + esc(item.title || "(제목 없음)") + '</span></a>';
        }).join("") + '</div>';
      return headHtml + subHtml;
    }).join("");
  }
  function wireSidebarToggles() {
    document.querySelectorAll(".wb-sb-head").forEach(function (head) {
      var chev = head.querySelector(".wb-sb-chev");
      if (!chev) return;
      chev.addEventListener("click", function (e) {
        e.preventDefault();
        var key = head.dataset.togglekey;
        var sub = document.querySelector('.wb-sb-sub[data-subkey="' + key + '"]');
        var willCollapse = !chev.classList.contains("collapsed");
        chev.classList.toggle("collapsed", willCollapse);
        if (sub) sub.classList.toggle("collapsed", willCollapse);
      });
    });
  }

  /* ---------------- filters (re-wired after every content swap) ---------------- */
  function wireFilters() {
    var row = document.getElementById("wbFilterRow");
    if (!row) return;
    var chips = row.querySelectorAll(".wb-filter-chip");
    var cards = document.querySelectorAll("[data-filter-tags]");
    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        chips.forEach(function (c) { c.classList.remove("on"); });
        chip.classList.add("on");
        var f = chip.dataset.filter;
        var shown = 0;
        cards.forEach(function (card) {
          var tags = (card.dataset.filterTags || "").split(",");
          var show = f === "all" || tags.indexOf(f) !== -1;
          card.style.display = show ? "" : "none";
          if (show) shown++;
        });
        var emptyEl = document.getElementById("wbGridEmpty");
        if (emptyEl) emptyEl.style.display = shown ? "none" : "";
      });
    });
  }

  /* ---------------- search (global, across every category) ---------------- */
  function buildSearchIndex() {
    var idx = [];
    (DATA.characters || []).forEach(function (c) { idx.push({ typeLabel: "등장인물", title: c.title, subtitle: (c.aliases || []).join(", "), body: c.summary, url: linkFor("characters", c.id) }); });
    (DATA.organizations || []).forEach(function (o) { idx.push({ typeLabel: "조직", title: o.title, subtitle: o.houseTypeLabel, body: o.summary, url: linkFor("organizations", o.id) }); });
    (DATA.locations || []).forEach(function (l) { idx.push({ typeLabel: "지역", title: l.title, subtitle: l.mapTitle, body: "", url: linkFor("locations", l.id) }); });
    (DATA.races || []).forEach(function (r) { idx.push({ typeLabel: "종족", title: r.title, subtitle: r.members.length + "명", body: "", url: linkFor("races", r.id) }); });
    (DATA.events || []).forEach(function (e) { idx.push({ typeLabel: "사건", title: e.title, subtitle: "", body: e.summary, url: linkFor("events", e.id) }); });
    (DATA.items || []).forEach(function (it) { idx.push({ typeLabel: "아이템", title: it.title, subtitle: "", body: it.summary, url: linkFor("items", it.id) }); });
    (DATA.settingsDocs || []).forEach(function (s) { idx.push({ typeLabel: s.category, title: s.title, subtitle: "", body: s.summary, url: linkFor("settings", s.id) }); });
    return idx;
  }
  function wireSearch(searchIndex) {
    var input = document.getElementById("wbSearchInput");
    var results = document.getElementById("wbSearchResults");
    if (!input || !results) return;
    function render(query) {
      var q = query.trim().toLowerCase();
      if (!q) { results.classList.remove("open"); results.innerHTML = ""; return; }
      var matches = searchIndex.filter(function (item) {
        return (item.title || "").toLowerCase().indexOf(q) !== -1 ||

    var toggleBtn = document.getElementById("wbSettingsBtn");

  /* ---------------- mobile nav ---------------- */

      ctx.font = (bold ? "bold " : "") + fontPx + "px " + fontStack;
      ensureRoom(lineHeightPx);
      y += lineHeightPx;
      ctx.fillText(text, marginPx, y);
      if (extraGapAfter) y += extraGapAfter;
    }

    newPage();
    chapters.forEach(function (ch, idx) {
      if (idx > 0) newPage(); // each chapter starts on a fresh page, like the DOCX/print convention
      ctx.font = "bold " + titleFontPx + "px " + fontStack;
      drawLine(ch.title || "(제목 없음)", titleFontPx, true, lineHeightPx * 0.6);
      var paras = (ch.text || "").split(/\n+/).filter(function (p) { return p.length; });
      if (!paras.length) paras = [""];
      paras.forEach(function (p) {
        ctx.font = bodyFontPx + "px " + fontStack;
        var lines = wrapLines(ctx, p, maxTextWidth);
        lines.forEach(function (line) { drawLine(line, bodyFontPx, false, 0); });
        y += Math.round(lineHeightPx * 0.35); // paragraph gap
      });
    });

    var jpegPages = [];
    for (var i = 0; i < pages.length; i++) {
      var bytes = await canvasToJpegBytes(pages[i], 0.85);
      jpegPages.push({ pixelWidth: pxW, pixelHeight: pxH, widthPt: widthPt, heightPt: heightPt, jpegBytes: bytes });
    }
    return jpegPages;
  }

/* ---- HWPX generator (template fragments captured from a real, working .hwpx —

   * attributes with no schema risk. */
  var HEADING_CHARPR_ID = "7";

    '<hh:charPr id="' + HEADING_CHARPR_ID + '" height="1700" textColor="#1F2A44" shadeColor="none" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="2">' +
    '<hh:fontRef hangul="1" latin="1" hanja="1" japanese="1" other="1" symbol="1" user="1"/>' +
    '<hh:ratio hangul="100" latin="100" hanja="100" japanese="100" other="100" symbol="100" user="100"/>' +
    '<hh:spacing hangul="0" latin="0" hanja="0" japanese="0" other="0" symbol="0" user="0"/>' +
    '<hh:relSz hangul="100" latin="100" hanja="100" japanese="100" other="100" symbol="100" user="100"/>' +
    '<hh:offset hangul="0" latin="0" hanja="0" japanese="0" other="0" symbol="0" user="0"/>' +
    '<hh:underline type="NONE" shape="SOLID" color="#000000"/>' +
    '<hh:strikeout shape="NONE" color="#000000"/>' +
    '<hh:outline type="NONE"/>' +
    '<hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/>' +
    '</hh:charPr>';

  function buildHeaderXml() {
    var base = HWPX_HEADER_XML_BASE;
    var withCount = base.replace('<hh:charProperties itemCnt="7">', '<hh:charProperties itemCnt="8">');
    if (withCount === base) throw new Error("hwpx: header.xml itemCnt anchor not found (template drift)");
    var withCharPr = withCount.replace('</hh:charProperties>', HEADING_CHARPR_XML + '</hh:charProperties>');
    if (withCharPr === withCount) throw new Error("hwpx: header.xml closing-tag anchor not found (template drift)");
    return withCharPr;

  function pad4(n) { var s = String(n); while (s.length < 4) s = "0" + s; return s; }
  var paraIdCounter = 0;
  function nextParaId() {
    paraIdCounter += 1;
    return String(1000000000 + paraIdCounter);
  }

  function contentParagraph(text, charPrId) {
    return '<hp:p id="' + nextParaId() + '" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">' +
      '<hp:run charPrIDRef="' + charPrId + '"><hp:t>' + hwpxEsc(text) + '</hp:t></hp:run></hp:p>';
